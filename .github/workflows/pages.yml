# index.html を GitHub Pages に配信する。
# main に push するたびに走る。
#
# ジョブを build / deploy に分けてあるのは意図的。
# environment: github-pages はジョブの開始時に解決されるが、その環境は
# Pages が有効化されて初めて作られる。1ジョブに詰めると、有効化を行う
# configure-pages が走る前に environment の解決で失敗する。
# 先に build 側で有効化を済ませておけば、deploy 側では環境が存在する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に1本だけ走らせる。走行中のものは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true でリポジトリ設定を手で触らずに Pages を有効化する。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # リポジトリ直下をそのまま配信する。index.html が単一HTMLで
      # 外部リソースを読まないため、ビルド工程は要らない。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
