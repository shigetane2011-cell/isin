<div class="wrap" id="app"></div>
<script type="module">
/* ==ENGINE START== */
/* ============================================================================
   維新の乱流 ― 決定論エンジン
   ・乱数は seed 付き mulberry32 のみ。Math.random / Date.now は一切使用しない。
   ・seed + 選択列 だけが状態を決める。同じ入力なら常に同じ盤面になる。
   ========================================================================== */

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const chars = s => Array.from(s).length;

/* --- PRNG --------------------------------------------------------------- */
function mulberry32(a){
  a = a >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 呼び出し順に依存しないよう、用途ごとに独立した流れを作る */
function streamOf(seed, turn, salt){
  let h = (seed >>> 0) ^ Math.imul(turn + 1, 0x9E3779B1) ^ Math.imul(salt + 1, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35) >>> 0;
  return mulberry32(h);
}
function pickDistinct(rnd, pool, n){
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

/* --- 勢力 --------------------------------------------------------------- */
const FACTIONS = [
  { key:'kobu',    name:'公武', full:'公武合体', cls:'f-kobu' },
  { key:'kaikoku', name:'開国', full:'開国通商', cls:'f-kaikoku' },
  { key:'sabaku',  name:'佐幕', full:'佐幕守旧', cls:'f-sabaku' },
  { key:'yuhan',   name:'雄藩', full:'雄藩連合', cls:'f-yuhan' },
  { key:'kosen',   name:'抗戦', full:'尊皇攘夷', cls:'f-kosen' },
];
/* 対立軸。史実で真っ向からぶつかった組み合わせを敵対関係として持つ。
   自分の盤面で相手の対立勢力が WARY_LINE 以上まで育っていると、
   その人物は端から警戒し、交渉の判定が一段下がる。
   「寄せすぎると誰も話を聞いてくれなくなる」という圧力を作るための規則。 */
const OPPOSED = [
  [4, 1, 3], // 公武 ↔ 抗戦（融和と過激攘夷）/ 開国（攘夷志向の朝廷）/ 雄藩（倒幕へ傾く大藩）
  [4, 0],    // 開国 ↔ 抗戦（開国か攘夷か）/ 公武
  [3, 4],    // 佐幕 ↔ 雄藩（幕府か倒幕か）/ 抗戦（新選組と志士）
  [2, 0],    // 雄藩 ↔ 佐幕 / 公武
  [2, 1, 0], // 抗戦 ↔ 佐幕 / 開国 / 公武
];

   カードを3枚組む／2枚だけ／1枚に賭ける／引かない、と手触りが変わる。

   響く働きかけは「利益の型」からほぼ導ける（＝対話や探りで既に学んでいる
   知識がそのまま効く）。そのうえで、型から外れる人物を手で指定してある。
   ------------------------------------------------------------------------ */

];
/* 利益の型 → 既定で響く働きかけ */
const APPROACH_BY_MOTIVE = [3, 2, 1, 0, 3, 0];
/* 型から外れる人物。「豪商だが金では動かぬ」「力自慢だが酒で落ちる」の類い */
const APPROACH_EXCEPTION = new Map([
  [2,1],[13,1],[19,1],[26,2],[29,2],[49,1],[51,1],[59,1],[65,1],[80,1],[87,1],[89,1],
  [95,3],[100,3],[103,3],[107,1],[116,0],[123,2],[129,3],[131,3],[134,1],
  [138,2],[140,0],[144,3],[145,3],[147,0],[148,0],[149,1],[150,3],
]);
const approachOf = id => APPROACH_EXCEPTION.has(id)
  ? APPROACH_EXCEPTION.get(id)
  : APPROACH_BY_MOTIVE[CHAR_BY_ID.get(id).correct[0]];
/* 転向は「攻撃」なので、大成功まで届く働きかけでしか仕掛けられない */
const canConvert = ap => APPROACHES[ap].cap === 3;

/* 中級・初級は勢力ごとのひな型で語る */
const FATE_TEMPLATE = [
  ['朝廷に連なる末席を得て、望んだとおりの静かな日々を送った。','御所の灯が遠ざかるのを、ただ見ているほかなかった。'],

  ['秩序は守られ、その禄は次の代にも受け継がれた。','徳川の名とともに職を失い、刀を売って商いを始めた。'],
  ['藩の名が天下に通じるようになり、その末端で仕事を得た。','藩は消え、県になった。自分が何者だったかを説明できなくなった。'],
  ['振るった刃は義挙と呼ばれ、その名は志士の列に加えられた。','時代は刃を必要としなくなり、その手だけが残された。'],
];
/* エンディングで採られた勢力の集合 */
function winningFactions(ending){
  if (ending.kind === 'solo') return [ending.faction];
  if (ending.kind === 'combo') return ending.pair.slice();
  return [];
}
function fateOf(charId, winners){
  const ch = CHAR_BY_ID.get(charId);
  const won = ch.factions.some(f => winners.includes(f));
  const pair = FATES.get(charId) || FATE_TEMPLATE[ch.factions[0]];
  return { won, text: pair[won ? 0 : 1] };
}


/* --- 立ち合い -------------------------------------------------------------
   短気な人物に転向を仕掛けて通らなかったとき、相手は刀に手をかける。
   新しい判定系は足していない。応じ方の正解は、その人物の「利益の型」で決まる。
   すでに対話や探りで型を掴んでいれば切り抜けられる ―― 既存の読みがそのまま効く。
   分岐が増えないのはこのため。文章も3通り×勝敗の6つで、人物ごとには持たない。
   ------------------------------------------------------------------------ */
const HOTHEADS = new Set([13,14,21,28,29,47,48,49,51,63,65,67,68,70,79,80,82,87,88,89,90,113,131,133,135]);
const DUELS = [
  { label:'抜き合わせる', win:'刃を交えたのは三合だった。相手が先に引いた。「……できるな」と、低く笑う。',
    lose:'踏み込みが遅れた。肩を裂かれ、血が袖を伝う。相手は刀を振って血を払い、去った。' },
  { label:'言葉で収める', win:'柄にかけた手が、ゆっくりと離れた。「……その言い分は、聞く値打ちがある」',
    lose:'言葉は届かなかった。「口ばかりだ」と吐き捨てられ、鞘で肩を打たれて倒れた。' },
  { label:'退く', win:'一歩下がって間合いを切った。相手は追わず、鼻を鳴らして刀を納めた。',
    lose:'背を向けた瞬間に踏み込まれた。逃げる者を、この男は許さなかった。' },
];
/* 利益の型 → 通じる応じ方。名誉と武は力に、大義と学は言葉に、金と保身は間合いに応じる。 */
const DUEL_ANSWER = [0, 2, 2, 1, 0, 1];
/* 立ち合いが起きる条件: 短気な相手に、説得が通らなかったとき。
   支持でも起きる ―― 見え透いた世辞は、この手の男をかえって怒らせる。 */
function duelPending(st, action){
  if (!HOTHEADS.has(action.charId)) return false;
  if ((action.approach ?? 0) === 1) return false;   // 杯を交わした相手は刀を抜かない
  /* 転向は「攻撃」。この手の男に仕掛ければ、通ろうと通るまいと刃が出る。
     支持なら、見え透いた世辞と受け取られたときだけ怒らせる。 */
  return action.stance === 'convert' || scoreOf(st, action) < 2;
}

/* --- 状態 ---------------------------------------------------------------- */
const MAX_TURN = 10, GOAL = 30, CAP = 40, COMBO_MIN = 10;
/* 相手を「探る」と3つの正解がすべて分かるが、手の内を明かした分だけ影響力が落ち、
   その交渉の獲得が1下がる。使えるのは1局に PROBE_LIMIT 回まで。
   回数を切らないと、探り続けるだけで勝ててしまい賭けが消える。 */
const PROBE_LIMIT = 4;
/* 幕間「政変」が起きるターン。この時点の上位2勢力の組合せで事件が決まる。 */
const INTERLUDE_TURN = 8;

function createState(seed){
  return { seed: seed >>> 0, turn: 1, currents:[0,0,0,0,0],
           contacts:[], banned:[], lastLen:0, probesUsed:0, interlude:null, lastPlace:null,
           actions:[], finished:false };
}
const totalOf = st => st.currents.reduce((a,b)=>a+b,0);
const eraOf   = st => eraOfTotal(totalOf(st));

/* 基点ID: (直前の論証文の文字数 × ターン数) を名簿数で割った剰余。第1ターンのみ seed から。
   原作は100名なので「下2桁」＝ %100 だった。名簿を広げたため法だけを合わせてある。
   名簿数を素数151にしてあるのは意図的で、法が合成数だと gcd(ターン数, 法) の倍数しか
   基点にならない（例: 法150のターン10では10の倍数15通りしか出ない）。素数なら全域に散る。 */
const ROSTER = 151;
function baseId(st){
  if (st.turn === 1) return Math.floor(streamOf(st.seed, 0, 7)() * ROSTER) + 1;
  const v = (st.lastLen * st.turn) % ROSTER;
  return v === 0 ? ROSTER : v;
}

/* 面会リスト: 通常枠3名 ＋ 紹介枠0..1名 */
/* 場の指定がある場合、3枠のうち2枠までをその場に集まる勢力へ寄せる。
   基点IDの算出はそのままで、前方送りの条件に「場に合うか」を足すだけ。 */
function meetingList(st, place){
  const era = eraOf(st), maxId = MAX_ID_BY_ERA[era];
  const pl = place == null ? null : PLACES[place];
  const b = baseId(st);
  const taken = new Set(), normal = [];
  const free = id => !taken.has(id) && !st.contacts.includes(id) && !st.banned.includes(id);
  /* 場が縛るのは3枠のうち1枠だけ。強く縛ると「毎ターン目当ての勢力を引ける」
     ようになり、誰と会えるかの制約が消えてしまう。荒事の場はもう1枠を短気な者に充てる。 */
  const suits = (id, slot) => {
    if (!pl) return true;
    if (pl.minRank != null && rankOfId(id) < pl.minRank) return false;
    if (slot === 0) return CHAR_BY_ID.get(id).factions.some(f => pl.favor.includes(f));
    if (slot === 1 && pl.hot) return HOTHEADS.has(id);
    return true;
  };
  [b, b + 37, b + 73].forEach((raw, slot) => {
    const r = raw > ROSTER ? raw - ROSTER : raw;
    let id = rankOfId(r) > era ? (r % 30) + 1 : r;   // ランク補正（強制変換）
    let guard = 0;
    while (guard++ < 400 && !(free(id) && suits(id, slot))) id = (id % maxId) + 1;
    if (!free(id)) { id = r; while (!free(id)) id = (id % maxId) + 1; }  // 条件を満たす者がいなければ場を無視
    taken.add(id); normal.push(id);
  });
  return { base: b, normal, intro: introPick(st, taken) };
}

/* 紹介枠: 人脈が空なら必ず null（原作の厳守事項）。
   優先順位は原作どおり ①未獲得 ②史実の結びつき ③より高ランク。
   ただし③を「絶対に最高ランク」とすると決定論ゆえ毎回同じ顔になるため、
   ランクを重み（初級1・中級4・上級9・伝説16）とした抽選にしてある。
   大物ほど来やすい性質は保ちつつ、局ごとに顔ぶれが変わる。 */
function introPick(st, exclude){
  if (!st.contacts.length) return null;
  const excl = new Set([...st.contacts, ...st.banned, ...(exclude || [])]);
  /* 決裂した人物の縁筋も閉じる。激怒した相手の周辺は、こちらに会おうとしない。 */
  for (const b of st.banned) for (const t of (TIE_GRAPH.get(b) || [])) excl.add(t);
  const tied = new Set();
  for (const c of st.contacts) for (const t of (TIE_GRAPH.get(c) || [])) if (!excl.has(t)) tied.add(t);
  let cands = [...tied].sort((a, b) => a - b);        // ②史実の結びつきを優先
  if (!cands.length){                                 // 縁が尽きたら同勢力の未獲得から
    const facs = new Set(st.contacts.flatMap(c => CHAR_BY_ID.get(c).factions));
    cands = CHARACTERS.filter(ch => !excl.has(ch.id) && ch.factions.some(f => facs.has(f))).map(ch => ch.id);
  }
  if (!cands.length) return null;
  const w = cands.map(id => (rankOfId(id) + 1) ** 2); // ③より高ランクを重みとして効かせる
  const rnd = streamOf(st.seed, st.turn, 4242);
  let r = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++){ r -= w[i]; if (r < 0) return cands[i]; }
  return cands[cands.length - 1];
}

/* 論証カードの提示（各カテゴリ3枚。正解1＋ダミー2、並びも決定論的） */
function cardOptions(st, charId, faction){
  const ch = CHAR_BY_ID.get(charId), out = [];
  for (let cat = 0; cat < 3; cat++){
    const correct = ch.correct[cat];
    const rnd = streamOf(st.seed, st.turn, charId * 13 + faction * 7 + cat);
    const decoys = pickDistinct(rnd, [0,1,2,3,4,5].filter(m => m !== correct), 2);
    out.push(pickDistinct(rnd, [correct, ...decoys], 3)
      .map(m => ({ motive:m, text: CARDS[faction][cat][m] })));
  }
  return out;
}

/* 論証文の組み立て。プレビューと判定で必ず同一の文字列になるよう1か所に集約する。
   ここで得られる文字数が、次ターンの基点IDを決める。 */
function composeArgument(argueF, cards, approach){
  const n = APPROACHES[approach ?? 0].cards;
  if (n === 0) return '（言葉ではなく、品を差し出した）';
  return [0,1,2].slice(0, n).map(i => CARDS[argueF][i][cards[i]]).join('。') + '。';
}

/* 提示された論証が何枚刺さるか。警戒による格下げまで含めた実効の点数。 */
/* 働きかけごとに、そもそも何を当てるのかが違う。
   論じる=3枚 / 酌み交わす=利益と文脈の2枚 / 金品=当てるものなし / 肚を割る=利益の1枚。
   そのうえで、響く働きかけなら一段良く、外した働きかけなら一段悪くなる。 */
function scoreOf(st, action){
  const ch = CHAR_BY_ID.get(action.charId);
  const ap = action.approach ?? 0, spec = APPROACHES[ap];
  let raw;
  if (ap === 0)      raw = [0,1,2].filter(i => action.cards[i] === ch.correct[i]).length;
  else if (ap === 1) raw = [0,1].filter(i => action.cards[i] === ch.correct[i]).length;
  else if (ap === 2) raw = ch.correct[0] === 3 ? 0 : 2;   // 大義に生きる者に物を贈るのは侮辱
  else               raw = action.cards[0] === ch.correct[0] ? 3 : 0;
  /* 読み違えの罰は「相手を読んだ前提」の働きかけだけに課す。
     論じる・酌み交わすは誰にでも一応通じる（最適ではないだけ）。
     金品と肚を割るは相手を読み切った上での賭けなので、外せば裏目に出る。 */
  if (ap >= 2 && approachOf(action.charId) !== ap) raw -= 1;
  if (waryOf(st.currents, action.charId) >= 0 && raw >= 2) raw -= 1;  // 警戒は決裂までは落とさない
  return clamp(raw, 0, spec.cap);
}

/* その人物が、こちらの旗色を見て警戒しているか */
function waryOf(currents, charId){
  const ch = CHAR_BY_ID.get(charId);
  for (const f of ch.factions)
    for (const o of OPPOSED[f])
      if (currents[o] >= WARY_LINE) return o;
  return -1;
}

/* --- 交渉の解決 ---------------------------------------------------------- */
/* action = { charId, stance, ownF, argueF, cards:[m0,m1,m2], probed:bool }
   probed は交渉前に相手を「探った」かどうか。探れば3つの正解すべてが分かるが、
   手の内を明かした分だけ影響力が落ち、その交渉の獲得が1下がる（最低1）。
   判定そのもの（大成功／成功／失敗／決裂）は変わらない。 */
function resolve(st, action){
  const ch = CHAR_BY_ID.get(action.charId);
  const era = eraOf(st), rank = rankOfId(action.charId);
  const premature = rank > era;                       // 時代整合性チェック
  const effRank = premature ? 0 : rank;               // 時期尚早ならボーナス無効（初級相当）

  const approach = action.approach ?? 0;
  const apSpec = APPROACHES[approach];
  const fits = approachOf(action.charId) === approach;
  const nCards = apSpec.cards;
  const hits = [0,1,2].map(i => i < nCards && action.cards[i] === ch.correct[i]);
  const rawScore = hits.filter(Boolean).length;
  const text  = composeArgument(action.argueF, action.cards, approach);
  const len   = chars(text);

  /* 警戒: こちらの旗色が鮮明すぎると、判定が一段下がる（決裂までは落とさない） */
  const waryBy = waryOf(st.currents, action.charId);
  const score  = scoreOf(st, action);

  /* 探れるのは残り回数がある場合のみ。リプレイでも同じ判定になるよう状態から決める。 */
  const probed = !!action.probed && st.probesUsed < PROBE_LIMIT;

  /* 転向は「攻撃」。3枚すべて刺さらねば通らない全か無かの賭け。 */
  const allOrNothing = action.stance === 'convert';
  let gain = score === 3 ? 4 : (score === 2 && !allOrNothing) ? 2 : 0;
  if (gain > 0){
    if (effRank === 1) gain += 1;
    else if (effRank === 2) gain += 2;
    else if (effRank === 3) gain *= 2;
  }
  /* 響く働きかけで通れば、それだけ深く刺さる（上限2の働きかけでも報われるよう獲得に乗せる） */
  /* 場に合った当たり方も同じだけ効くが、両方は重ねない。
     場は「相手には響かないが、ここでならやりようがある」という代替路である。 */
  const placeFits = action.place != null && PLACES[action.place].boost === approach;
  if (gain > 0 && (fits || placeFits)) gain += 1;

  /* 探った代償: その交渉で得られる時勢が1下がる（最低1）。
     元の獲得が大きい大物ほど、相対的な代償は軽く済む。 */
  const gainBeforeProbe = gain;
  if (gain > 0 && probed) gain = Math.max(1, gain - 1);
  const succeeded = gain > 0;
  let penalty = 0;
  if (!succeeded && !premature){
    if (effRank === 2) penalty = 1;
    else if (effRank === 3) penalty = 3;
  }

  const cur = st.currents.slice();
  const before = cur.slice();
  if (succeeded){
    cur[action.argueF] += gain;
    if (action.stance === 'convert') cur[action.ownF] -= (score === 3 ? 2 : 1);
  }
  if (penalty) cur[action.stance === 'support' ? action.ownF : action.argueF] -= penalty;
  /* 肚を割って外せば、明かした旗色ごと恥をかく */
  if (approach === 3 && score === 0) cur[action.argueF] -= 2;
  for (let i = 0; i < 5; i++) cur[i] = clamp(cur[i], 0, CAP);

  const contacts = st.contacts.slice(), banned = st.banned.slice();
  if (succeeded && !contacts.includes(action.charId)) contacts.push(action.charId);
  if (score === 0 && !banned.includes(action.charId)) banned.push(action.charId);

  /* 立ち合い。action.duel が無い場合（幕間より前の保存コード）は起きなかったものとして扱う。 */
  let duel = null;
  if (action.duel != null && duelPending(st, action)){
    const answer = DUEL_ANSWER[ch.correct[0]];
    const survived = action.duel === answer;
    duel = { choice: action.duel, survived,
             text: survived ? DUELS[action.duel].win : DUELS[action.duel].lose };
    if (survived){
      if (!contacts.includes(action.charId)) contacts.push(action.charId);
      const bi = banned.indexOf(action.charId); if (bi >= 0) banned.splice(bi, 1);
    } else {
      cur[action.argueF] = clamp(cur[action.argueF] - 3, 0, CAP);
      if (!banned.includes(action.charId)) banned.push(action.charId);
      const ci = contacts.indexOf(action.charId); if (ci >= 0) contacts.splice(ci, 1);
    }
  }

  const next = {
    seed: st.seed, turn: st.turn + 1, currents: cur, contacts, banned,
    lastLen: len, lastPlace: action.place ?? null,
    /* 立ち合いに敗れると、深追いする余裕を失う（探りを1回失う） */
    probesUsed: Math.min(PROBE_LIMIT, st.probesUsed + (probed ? 1 : 0)
      + (approach === 2 ? 1 : 0) + (duel && !duel.survived ? 1 : 0)),
    interlude: st.interlude,
    actions: st.actions.concat([action]), finished: false,
  };
  next.finished = next.turn > MAX_TURN || cur.some(v => v >= CAP);

  return { next, report: {
    charId: action.charId, name: ch.name, score, rawScore, hits, premature, rank, effRank,
    gain, gainBeforeProbe, penalty, text, len, probed, duel, approach, fits, nCards,
    place: action.place ?? null, placeFits,
    probesLeft: PROBE_LIMIT - (st.probesUsed + (probed ? 1 : 0)),
    stance: action.stance, ownF: action.ownF, argueF: action.argueF, waryBy, allOrNothing,
    delta: cur.map((v, i) => v - before[i]),
    verdict: succeeded ? (score === 3 ? '大成功' : '成功') : ['決裂','失敗','失敗','失敗'][score],
    /* 立ち合いで覆ることがあるので、表示は実際の状態変化から決める */
    contactAdded: contacts.includes(action.charId) && !st.contacts.includes(action.charId),
    bannedNow: banned.includes(action.charId) && !st.banned.includes(action.charId),
  }};
}

/* --- 幕間 ---------------------------------------------------------------- */
/* 上位2勢力の組合せ。単独で突出していても2番目まで見て事件を決める。 */
function topPairKey(currents){
  const o = [0,1,2,3,4].sort((a,b) => currents[b] - currents[a] || a - b);
  return [o[0], o[1]].sort((x,y) => x - y).join('+');
}
/* 第8ターンの開始時に一度だけ。未消化なら幕間データを返す */
function pendingInterlude(st){
  if (st.finished || st.turn !== INTERLUDE_TURN || st.interlude) return null;
  const key = topPairKey(st.currents);
  return Object.assign({ key }, INTERLUDES[key]);
}
function applyInterlude(st, choice){
  const iv = pendingInterlude(st);
  if (!iv) return st;
  if (!Number.isInteger(choice) || !iv.opts[choice]) throw new Error('幕間の選択番号が不正です');
  const o = iv.opts[choice];
  const cur = st.currents.map((v, i) => clamp(v + o.d[i], 0, CAP));
  return Object.assign({}, st, {
    currents: cur,
    interlude: { key: iv.key, choice, tag: o.tag, title: iv.title, after: o.after },
    /* 幕間の増減で上限に達したら、その時点で終局とする（交渉と同じ扱い） */
    finished: st.finished || cur.some(v => v >= CAP),
  });
}

/* --- エンディング判定 ---------------------------------------------------- */
function evaluateEnding(st){
  const cur = st.currents, max = Math.max(...cur);
  if (max >= GOAL){
    const f = cur.indexOf(max);
    return Object.assign({ kind:'solo', faction:f }, ENDINGS.solo[f]);
  }
  const order = [0,1,2,3,4].sort((a,b) => cur[b] - cur[a] || a - b);
  const [a, b] = order;
  /* 「複合革命」を名乗るには、二番目の勢力も実体を伴っている必要がある。
     29+1 のような偏った内訳は連立ではなく、単に一勢力が届かなかっただけとみなす。 */
  if (cur[a] + cur[b] >= GOAL && cur[b] >= COMBO_MIN){
    const key = [a,b].sort((x,y) => x - y).join('+');
    return Object.assign({ kind:'combo', pair:[a,b] }, ENDINGS.combo[key] || ENDINGS.combo['etc']);
  }
  return Object.assign({ kind:'chaos' }, ENDINGS.chaos);
}

/* --- リプレイ / セーブ ---------------------------------------------------- */
function replay(seed, actions, interludeChoice){
  let st = createState(seed);
  const reports = [];
  for (const a of actions){
    if (st.finished) break;
    /* 幕間は第8ターンの交渉より前に解決する */
    if (interludeChoice != null && pendingInterlude(st)) st = applyInterlude(st, interludeChoice);
    if (st.finished) break;
    const r = resolve(st, a);
    st = r.next; reports.push(r.report);
  }
  return { state: st, reports };
}
function encodeSave(st){
  return 'IR4:' + st.seed + ':' + st.actions
    .map(a => [a.charId, a.stance === 'support' ? 0 : 1, a.ownF, a.argueF, a.cards.join(''),
               a.probed ? 1 : 0, a.approach ?? 0, a.place ?? ''].join(',')
              + (a.duel != null ? ',' + a.duel : ''))
    .join(';') + (st.interlude ? '#' + st.interlude.choice : '');
}
function decodeSave(code){
  const s = String(code).trim();
  /* IR3 は幕間の追加より前の版。幕間を「未選択」として扱えばそのまま再現できる。 */
  if (!/^IR[34]:/.test(s)) throw new Error(/^IR[12]:/.test(s)
    ? '旧版の保存コードです。名簿と判定ルールが変わったため再現できません'
    : 'コードの形式が違います');
  const parts = s.slice(4).split(':');
  if (!/^\d+$/.test(parts[0])) throw new Error('seed が数値ではありません');
  const seed = parseInt(parts[0], 10) >>> 0;
  const raw = parts.slice(1).join(':');
  const hash = raw.indexOf('#');
  const choiceText = hash >= 0 ? raw.slice(hash + 1) : '';
  if (hash >= 0 && !/^[0-2]$/.test(choiceText)) throw new Error('幕間の選択番号が不正です');
  const interludeChoice = hash >= 0 ? +choiceText : null;
  const body = hash >= 0 ? raw.slice(0, hash) : raw;
  const actions = !body ? [] : body.split(';').filter(Boolean).map(chunk => {
    const [c, s2, o, f, k, h, apr, plc, dl] = chunk.split(',');
    if (apr !== undefined && !/^[0-3]$/.test(apr)) throw new Error('働きかけの番号が不正です');
    if (plc !== undefined && plc !== '' && !/^[0-5]$/.test(plc)) throw new Error('場の番号が不正です');
    if (dl !== undefined && !/^[0-2]$/.test(dl)) throw new Error('立ち合いの応じ方が不正です');
    return { charId:+c, stance: +s2 === 0 ? 'support' : 'convert',
             ownF:+o, argueF:+f, cards: Array.from(k).map(Number), probed: +(h || 0) === 1,
             approach: apr === undefined ? 0 : +apr,
             place: plc === undefined || plc === '' ? null : +plc,
             duel: dl === undefined ? null : +dl };
  });
  return { seed, actions, interludeChoice };
}
function hashState(st){
  const s = JSON.stringify([st.seed, st.turn, st.currents, st.contacts, st.banned,
                            st.lastLen, st.probesUsed, st.interlude, st.lastPlace, st.finished]);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

        ／ この場で深く刺さるのは <span class="uibadge">◎ ${esc(E.APPROACHES[p.boost].name)}</span></div>
    </div>`;
  };
  app.innerHTML = headerHTML() + chartHTML() +
    `<div class="panel"><h2>どこへ行きますか</h2>
      ${guidedTurn()
        ? coachHTML('一', 'まずは茶屋へ', '毎ターン、はじめに行き先を選びます。場によって集まる者と、できる働きかけが変わります。練習では祇園の茶屋に固定します。')
        : '<div class="small" style="margin-bottom:8px">場によって集まる者が変わり、できる働きかけも変わります。</div>'}
      ${open.map(card).join('')}
      ${(guidedTurn() ? [] : locked).map(i => `<div class="person" style="opacity:.4">
        <div><span class="nm">${esc(E.PLACES[i].name)}</span><span class="tag">${esc(E.PLACES[i].where)}</span></div>
        <div class="small">${i === st.lastPlace
          ? '昨日も通った。続けて顔を出せば噂になる'
          : `まだ登れる身分ではない（${E.ERAS[E.PLACES[i].unlockEra]}から）`}</div></div>`).join('')}
    </div>` + saveBoxHTML();
  app.querySelectorAll('[data-place]').forEach(el => el.onclick = () => { ui.place = +el.dataset.place; render(); });
  app.querySelectorAll('[role="button"]').forEach(el => el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
}

/* --- 画面: 幕間「政変」 --------------------------------------------------- */
function viewInterlude(){
  const iv = ui.interludeData || E.pendingInterlude(st);
  ui.interludeData = iv;
  const picked = ui.interludePicked;
  const body = picked === null
    ? `<div class="row" style="display:block">${iv.opts.map((o, i) =>
        `<button class="choice" data-pick="${i}">${esc(o.label)}</button>`).join('')}</div>
       <div class="small" style="margin-top:10px;opacity:.7">正解はありません。どれを選ぶかが、あなたの立場です。</div>`
    : `<div class="say" style="border-left-color:var(--shu)"><span class="q">「${esc(iv.opts[picked].label)}」</span><br>${
        esc(iv.opts[picked].res)}</div>
       <div class="row"><button class="primary" id="ilnext">続ける</button></div>`;
  app.innerHTML = headerHTML() +
    `<div class="panel interlude tone-panel" style="${toneStyle(iv.key.split('+').map(Number))}">
      <div class="kind">幕間 ― 第${E.INTERLUDE_TURN}ターン</div>
      <div class="title">『${esc(iv.title)}』</div>
      <p>${esc(iv.scene)}</p>
      ${body}
    </div>` + (picked === null ? '' : chartHTML());
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const i = +b.dataset.pick;
    st = E.applyInterlude(st, i); ui.interludePicked = i; render();
  });
  const nx = document.getElementById('ilnext');
  if (nx) nx.onclick = () => {
    ui.interludePicked = null; ui.interludeData = null; ui.place = null;
    ui.screen = st.finished ? 'ending' : 'meeting'; render();
  };
}

/* --- 画面: 立場の決定 ----------------------------------------------------- */
function viewStance(){
  const c = E.CHAR_BY_ID.get(ui.charId);
  const activeFs = ui.ownF === null ? c.factions.slice() : [ui.ownF];
  let body = '';
  if (ui.ownF === null && c.factions.length > 1){
    body = `<p>${esc(c.name)}は複数の顔を持ちます。<b>どの属性に向き合いますか？</b></p>
      <div class="row">${c.factions.map(f =>
        `<button data-own="${f}">${fac(f).name}（${fac(f).full}）</button>`).join('')}</div>`;
  } else {
    if (ui.ownF === null) ui.ownF = c.factions[0];
    if (ui.stance === null){
      const wb2 = E.waryOf(st.currents, ui.charId);
      body = `<p>${esc(c.name)}〔${fac(ui.ownF).name}〕にどう臨みますか？</p>
        ${wb2 >= 0 ? `<div class="warn">この人物は、あなたが掲げる〔${fac(wb2).name}〕を警戒している。判定が一段下がる。</div>` : ''}
        <div class="row">
          <button class="primary" data-stance="support">支持する<span class="small">（${fac(ui.ownF).name}を伸ばす）</span></button>
          <button data-stance="convert" ${guidedTurn() ? 'disabled' : ''}>論破して転向させる<span class="small">（別の思想に引き込む）</span></button>
        </div>
        ${E.HOTHEADS.has(ui.charId) ? '<div class="warn">この者は気が短い。<b>転向を仕掛ければ必ず刃が出る</b>。支持でも、通らなければ怒らせる。</div>' : ''}
        <div class="small" style="margin-top:10px">
          <b>支持</b>は2枚一致でも通る。だが伸びるのは相手の勢力〔${fac(ui.ownF).name}〕。<br>
          <b>転向</b>は攻撃。<b>3枚すべて刺さらねば通らない</b>全か無かの賭けだが、通れば自分の掲げる勢力が伸び、相手の勢力を削れる。
        </div>`;
    } else if (ui.stance === 'convert' && ui.argueF === null) {
      body = `<p><b>転向</b>を狙います。どの思想に引き込みますか？</p>
        <div class="row">${[0,1,2,3,4].filter(f => f !== ui.ownF).map(f =>
          `<button data-argue="${f}">${fac(f).name}（${fac(f).full}）</button>`).join('')}</div>`;
    } else {
      const left = E.PROBE_LIMIT - st.probesUsed;
      body = `<p>どう働きかけますか？</p>
        <div class="row" style="display:block">${E.APPROACHES.map((a, i) => {
          const noGuide = guidedTurn() && i !== 0;
          const noPlace = ui.place !== null && !E.placeAllows(ui.place, i);
          const noConvert = ui.stance === 'convert' && !E.canConvert(i);
          const noProbe = i === 2 && left <= 0;
          const off = noGuide || noPlace || noConvert || noProbe;
          const why = noGuide ? '（練習では論じるに絞ります）'
                    : noPlace ? `（${esc(E.PLACES[ui.place].name)}ではできない）`
                    : noConvert ? '（転向は論じるか肚を割るでしか通らない）'
                    : noProbe ? '（探りを使い切っている）' : '';
          return `<button class="choice" data-approach="${i}" ${off ? 'disabled' : ''}>
            <b>${esc(a.name)}</b>${a.cards === 3 ? '' : `　<span class="small">カード${a.cards}枚</span>`}
            ${ui.place !== null && E.PLACES[ui.place].boost === i && !off
              ? '<span class="small uibadge">　◎ この場に合う</span>' : ''}
            <span class="small" style="display:block;opacity:.8">${esc(a.desc)}${why}</span></button>`;
        }).join('')}</div>
        <div class="small" style="margin-top:8px;opacity:.7">相手に響く当たり方は、その者が何を望んでいるかで決まります。</div>`;
    }
  }
  const wb0 = E.waryOf(st.currents, ui.charId);
  const said = [];
  if (ui.asked !== null)
    said.push(`<div class="say"><span class="q">「${esc(E.QUESTIONS[ui.asked].chip)}か」</span><br>${
      esc(E.REPLIES[ui.asked][c.correct[ui.asked]])}</div>`);
  for (const k of ui.chatted)
    said.push(k === 'impression'
      ? `<div class="say"><span class="q">「拙者をどう見ておられる」</span><br>${
          wb0 >= 0
            ? esc(`〔${fac(wb0).name}〕の御方だと聞いておる。……何を申されても、そちらの利になるだけであろう。`)
            : esc('まだ何者とも決めかねておる。だからこうして会うておるのだ。')}</div>`
      : `<div class="say"><span class="q">「${esc(E.SMALLTALK[0].chip)}」</span><br>${
          esc(E.SMALLTALK[0].lines[ui.ownF ?? c.factions[0]])}</div>`);

  const chips = `
    <div class="slot-h">対話 <span style="opacity:.7">— 踏み込んだ問いは<b>一つだけ</b>。返答は、その者に何が刺さるかを語る</span></div>
    <div class="row">
      ${E.QUESTIONS.map((q, i) => ui.asked === i
        ? `<span class="chip used">${esc(q.chip)}</span>`
        : ui.asked !== null
          ? `<span class="chip spent">${esc(q.chip)}</span>`
          : `<button class="chip" data-ask="${i}">${esc(q.chip)}</button>`).join('')}
    </div>
    <div class="row">
      ${ui.chatted.includes('era') ? '' : `<button class="chip talk" data-chat="era">${esc(E.SMALLTALK[0].chip)}</button>`}
      ${ui.chatted.includes('impression') ? '' : '<button class="chip talk" data-chat="impression">拙者をどう見ておられる</button>'}
    </div>
    ${said.join('')}
    ${(() => {
      const n = E.NOTES.get(ui.charId);
      if (!n) return '';
      return `<details class="detail yowa"><summary>余話 ― 史実のこの人物</summary>
        <div class="small" style="margin-top:6px">${esc(n.note)}</div>
        ${n.works ? `<div class="small" style="margin-top:6px;color:var(--kin)">関連作品：${esc(n.works)}</div>` : ''}
        ${n.spot ? `<div class="small" style="margin-top:6px">ゆかりの地：<a class="spot" href="https://www.google.com/maps/search/?api=1&amp;query=${
          encodeURIComponent(n.spot)}" target="_blank" rel="noopener noreferrer">${esc(n.spot)} を地図で見る ↗</a></div>` : ''}
        <div class="small" style="margin-top:6px;opacity:.6">※ 史実の記述です。ゲーム上の「刺さる型」とは別ですが、読み解きの助けにはなります。地図リンクは押したときだけ外部サイトを開きます。</div>
      </details>`;
    })()}`;

  const guide = guidedTurn()
    ? ui.ownF === null && c.factions.length > 1
      ? coachHTML('三', '向き合う属性を決める', `${esc(c.name)}は複数の勢力に属します。練習で読み解く側面を一つ選んでください。`)
      : coachHTML('三', 'まずは支持と「論じる」で仕組みを覚える', '支持は<b>3枚中2枚一致でも成功</b>します。練習では転向と、論じる以外の働きかけを封じ、次の画面で正解と根拠を見ながら3枚を組みます。')
    : '';

  app.innerHTML = headerHTML() + meetingVisualHTML(c) +
    `<div class="panel tone-panel" style="${toneStyle(activeFs)}"><h2>${esc(c.name)} — ${esc(c.nick)}</h2>
      <div class="opening">「${esc(E.SAYS.get(ui.charId) || '')}」</div>
      ${guide}<div class="quote">${esc(c.desc)}</div>${chips}<hr>${body}
      <div class="row" style="margin-top:14px"><button id="back">面会相手を選び直す</button></div>
    </div>`;
  app.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => { ui.asked = +b.dataset.ask; render(); });
  app.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => { ui.chatted.push(b.dataset.chat); render(); });
  app.querySelectorAll('[data-own]').forEach(b => b.onclick = () => { ui.ownF = +b.dataset.own; render(); });
  app.querySelectorAll('[data-stance]').forEach(b => b.onclick = () => {
    ui.stance = b.dataset.stance;
    if (ui.stance === 'support') ui.argueF = ui.ownF;
    render();
  });
  app.querySelectorAll('[data-argue]').forEach(b => b.onclick = () => { ui.argueF = +b.dataset.argue; render(); });
  app.querySelectorAll('[data-approach]').forEach(b => b.onclick = () => {
    ui.approach = +b.dataset.approach; ui.screen = 'cards'; render();
  });
  document.getElementById('back').onclick = () => { ui.screen = 'meeting'; render(); };
}

/* --- 画面: 論証の組み立て ------------------------------------------------- */
function viewCards(){
  const c = E.CHAR_BY_ID.get(ui.charId);
  ui.opts = E.cardOptions(st, ui.charId, ui.argueF);
  const guided = guidedTurn();
  const nCards = E.APPROACHES[ui.approach].cards;
  const ready = [0,1,2].slice(0, nCards).every(i => ui.picks[i] !== null);
  const left = E.PROBE_LIMIT - st.probesUsed;
  const text = ready ? E.composeArgument(ui.argueF, ui.picks, ui.approach) : '';
  app.innerHTML = headerHTML() +
    `<div class="panel tone-panel" style="${toneStyle([ui.argueF])}"><h2>${esc(c.name)}を${ui.stance === 'support' ? '支持する' : `${fac(ui.argueF).name}へ転向させる`}</h2>
      <div class="quote">${esc(c.desc)}</div>
      <div class="small">語る言葉は〔${fac(ui.argueF).name}〕の思想のもの。だが<b>刺さるかどうかは相手の型</b>で決まります。</div>
      ${guided ? coachHTML('三', '正解と根拠を見て三枚を組む', 'この1ターンだけ、正解のカードを金色で示し、通常は一つしか聞けない<b>三つの返答</b>を根拠として開示します。金色のカードを一枚ずつ選んでください。') : ''}
      ${ui.asked !== null ? `<div class="say"><span class="q">「${esc(E.QUESTIONS[ui.asked].chip)}か」</span><br>${
        esc(E.REPLIES[ui.asked][c.correct[ui.asked]])}</div>` : ''}
      ${ui.stance === 'convert' ? '<div class="warn">転向は3枚すべて刺さらねば通りません。</div>' : ''}
      ${E.waryOf(st.currents, ui.charId) >= 0 ? '<div class="warn">警戒されているため、判定は一段下がります。</div>' : ''}
      <div class="row" style="margin-top:12px">
        ${guided
          ? '<span class="probed">練習中 — 正解の開示に「探る」は消費しません</span>'
          : ui.probed
          ? '<span class="probed">◎ 探り済み — この交渉の獲得は 1 下がる</span>'
          : left > 0
            ? `<button class="probe" id="probe">この相手を探る（残り ${left} 回・獲得 −1）</button>`
            : '<span class="probed" style="opacity:.6">探りは使い切った（1局 ' + E.PROBE_LIMIT + ' 回まで）</span>'}
      </div>
      ${E.CATS.slice(0, nCards).map((cat, i) => `
        <div class="slot-h">${i+1}. ${cat.name} <span style="opacity:.7">— ${cat.hint}</span></div>
        ${ui.opts[i].map(o => {
          const isCorrect = o.motive === c.correct[i];
          const isAns = (ui.probed || guided) && isCorrect;
          const guideClass = guided ? (isCorrect ? 'guide-answer' : 'guide-decoy') : '';
          return `<div class="card ${ui.picks[i]===o.motive?'sel':''} ${isAns?'ans':''} ${guideClass}" data-cat="${i}" data-m="${o.motive}" role="button" tabindex="${guided && !isCorrect ? '-1' : '0'}" aria-disabled="${guided && !isCorrect}" aria-pressed="${ui.picks[i]===o.motive}">${
            isAns ? `<span class="mark">◎ ${guided ? '練習の正解' : 'これが刺さる'}</span> ` : ''}${esc(o.text)}${
            guided && isCorrect ? tutorialReasonHTML(c, i) : ''}</div>`;
        }).join('')}
      `).join('')}
      ${ready ? `<div class="slot-h">組み上がった論証（${Array.from(text).length} 字）</div>
        <div class="quote">「${esc(text)}」</div>` : ''}

      <div class="row">
        <button class="primary" id="go" ${ready?'':'disabled'}>${guided ? '正解の論で臨む' : 'この論で臨む'}</button>
        <button id="back">戻る</button>
      </div>
    </div>`;
  app.querySelectorAll('.card').forEach(el => el.onclick = () => {
    const cat = +el.dataset.cat, motive = +el.dataset.m;
    if (guided && motive !== c.correct[cat]) return;
    ui.picks[cat] = motive; render();
  });
  const pb = document.getElementById('probe');
  if (pb) pb.onclick = () => { ui.probed = true; render(); };
  document.getElementById('back').onclick = () => { ui.approach = null; ui.screen = 'stance'; render(); };
  document.getElementById('go').onclick = () => {
    const a = { charId: ui.charId, stance: ui.stance, ownF: ui.ownF, argueF: ui.argueF,
                cards: ui.picks.map(v => v === null ? 0 : v), probed: ui.probed,
                approach: ui.approach, place: ui.place };
    if (E.duelPending(st, a)){ ui.duelAction = a; ui.screen = 'duel'; render(); return; }
    const r = E.resolve(st, a);
    st = r.next; ui.report = r.report; ui.screen = 'result'; render();
  };
}

/* --- 画面: 立ち合い ------------------------------------------------------- */
function viewDuel(){
  const a = ui.duelAction, c = E.CHAR_BY_ID.get(a.charId);
  app.innerHTML = headerHTML() +
    `<div class="panel duel">
      <div class="kind">立ち合い</div>
      <div class="title">${esc(c.name)}が刀に手をかけた</div>
      <p>${ui.duelAction.stance === 'convert'
        ? `言い分がどうであれ、${esc(c.name)}は柄に手をかけた。転向を迫るとは、そういうことだ。`
        : `見え透いた世辞と受け取られた。${esc(c.name)}の目つきが変わり、柄に手がかかる。`}間合いは、もう詰まっている。</p>
      <div class="row" style="display:block">${E.DUELS.map((d, i) =>
        `<button class="choice" data-duel="${i}">${esc(d.label)}</button>`).join('')}</div>
      <div class="small" style="margin-top:10px;opacity:.7">この男に何が通じるか ―― 望んでいるものを思い出せ。</div>
    </div>`;
  app.querySelectorAll('[data-duel]').forEach(b => b.onclick = () => {

  });
}

/* --- 画面: 結果 ---------------------------------------------------------- */
function viewResult(){
  const r = ui.report, c = E.CHAR_BY_ID.get(r.charId);
  const guidedResult = !!(ui.guidedTutorial && st.actions.length === 1);
  const marks = r.hits.slice(0, r.nCards).map((h,i) => `<div class="small">${h?'☑':'☐'} ${E.CATS[i].name}：${
    h ? (r.probed ? '刺さった（探って得た）' : '刺さった')
      : `外れ（この人物に効くのは「${E.CATS[i].motives[c.correct[i]]}」）`}</div>`).join('');
  const d = r.delta.map((v,i) => v ? `<span class="${fac(i).cls}">[${fac(i).name}] ${v>0?'+':''}${v}</span>` : null)
    .filter(Boolean).join('　') || '変動なし';
  app.innerHTML = headerHTML() +
    `<div class="result ${r.gain > 0 ? 'succeeded' : 'failed'}" style="${toneStyle([r.argueF])}">
      <div class="verdict v${r.score}">${r.verdict}</div>
      ${guidedResult ? coachHTML('完', '一手のチュートリアル完了', '三つの返答から三枚の型を読み、論証を組む流れは以上です。次のターンからは<b>踏み込んだ問いは一つだけ</b>。残りは情勢描写から読むか、「探る」を使うか、賭けてください。') : ''}
      ${factionLegendHTML([r.argueF])}
      <div class="small" style="margin-top:4px">${esc(c.name)}（${E.RANKS[r.rank]}）に${
        r.stance==='support'?'賛意を示した':`${fac(r.argueF).name}への転向を迫った`}</div>
      <div class="quote">「${esc(r.text)}」</div>
      ${marks}
      <div class="small" style="margin-top:4px">${r.place != null ? esc(E.PLACES[r.place].name) + '　' : ''}働きかけ：<b>${esc(E.APPROACHES[r.approach].name)}</b>${
        r.placeFits ? '　<span class="uibadge">◎ 場に合った（獲得+1）</span>' : ''}${
        r.fits ? '　<span class="uibadge">◎ この者に響いた（獲得+1）</span>'
               : r.approach >= 2 ? '　<span style="color:var(--shu)">読み違え（一段下がった）</span>' : ''}</div>
      ${r.duel ? `<div class="duelresult ${r.duel.survived ? 'won' : 'lost'}">
        <b>${esc(E.DUELS[r.duel.choice].label)}</b><br>${esc(r.duel.text)}
        <div class="small" style="margin-top:6px">${r.duel.survived
          ? '腕を認められ、この者は【人脈】に加わった。'
          : `手傷を負った。〔${fac(r.argueF).name}〕−3、探りを1回失い、この者は二度と現れない。`}</div>
      </div>` : ''}
      ${r.probed && r.gain > 0 ? `<div class="warn">※ 探りを入れたため、獲得が ${r.gainBeforeProbe} から ${r.gain} に下がりました（探り残り ${r.probesLeft} 回）</div>` : ''}
      ${r.waryBy >= 0 ? `<div class="warn">※ あなたの掲げる〔${fac(r.waryBy).name}〕への警戒により、${r.rawScore}枚一致が一段下げられました</div>` : ''}
      ${r.allOrNothing && r.score === 2 ? `<div class="warn">※ 転向は3枚すべて刺さらねば通りません。2枚では相手は動きませんでした</div>` : ''}
      ${r.premature ? `<div class="warn">※ 時期尚早のため、${E.RANKS[r.rank]}級ですが影響力は限定的です（ランク補正を無効化）</div>` : ''}
      ${r.penalty ? `<div class="warn">※ ${E.RANKS[r.rank]}級との交渉に失敗し時勢 -${r.penalty}</div>` : ''}
      <div class="delta">${d}</div>
      ${r.contactAdded ? `<div class="small">→ ${esc(c.name)}が【人脈】に加わった。</div>` : ''}
      ${r.bannedNow ? `<div class="small">→ ${esc(c.name)}は激怒し、二度と現れない。<b>その縁筋も閉じた</b>（${
        [...(E.TIE_GRAPH.get(r.charId) || [])].slice(0, 4).map(i => esc(E.CHAR_BY_ID.get(i).name)).join('・') || '縁者なし'
      }${(E.TIE_GRAPH.get(r.charId)?.size || 0) > 4 ? ' ほか' : ''} からの紹介が絶えた）</div>` : ''}
      <div class="small" style="margin-top:8px;opacity:.7">この論証は ${r.len} 字。次の面会者はこの数から導かれます。</div>
    </div>` + chartHTML() +
    `<div class="row"><button class="primary" id="next">${st.finished?'結末を見る':guidedResult?'第2ターンへ（通常進行）':'次のターンへ'}</button></div>`
    + saveBoxHTML();
  document.getElementById('next').onclick = () => {
    if (guidedResult) ui.guidedTutorial = false;
    ui.place = null;                       // ターンが変われば行き先から選び直す
    ui.screen = st.finished ? 'ending' : 'meeting'; render();
  };
}

/* --- 画面: エンディング --------------------------------------------------- */
function viewEnding(){
  const e = E.evaluateEnding(st);
  const endingFs = E.winningFactions(e);
  const heads = ['国内政治','国際関係','あなたのその後'];
  app.innerHTML = headerHTML() + chartHTML() +
    `<div class="panel ending tone-panel" style="${toneStyle(endingFs)}">
      <div class="kind">${e.kind==='solo'?'単独覇権エンド':e.kind==='combo'?'複合革命エンド':'混沌エンド'}</div>
      <div class="title">『${esc(e.t)}』</div>
      <div class="kind" style="color:var(--sumi2)">${esc(e.s)}</div>
      ${endingVisualHTML(e)}
      ${e.p.map((para,i) => `<h3>${heads[i]}</h3><p>${esc(para)}</p>`).join('')}
      ${st.interlude ? `<h3>あの夜の選択</h3><p>『${esc(st.interlude.title)}』において、あなたは<b>${
        esc(st.interlude.tag)}</b>。<br>${esc(st.interlude.after || '')}</p>` : ''}
      ${epilogueHTML(e)}
    </div>` + saveBoxHTML() +
    `<div class="row"><button class="primary" id="again">最初から</button></div>`;
  document.getElementById('again').onclick = () => {
    st = null; ui.screen = 'title'; ui.guidedTutorial = false; ui.seedDraft = freshSeed(); render();
  };
}

const CREDIT = `<hr><div class="small" style="text-align:center;opacity:.7;padding-bottom:20px">
  原案『維新の乱流 ― 幕末、日本の夜明けを設計せよ ―』ミッキーベルグ<br>
  本実装は原案のルールを、LLMを使わない決定論的プログラムとして再構成したものです。<br>
  史実を題材としたフィクションであり、人物像・勢力分類はゲーム上の解釈です。
</div>`;

/* 築いた人脈が、選んだ未来の中でどうなったか */
function epilogueHTML(ending){
  if (!st.contacts.length && !st.banned.length) return '';
  const winners = E.winningFactions(ending);
  const sorted = st.contacts.slice().sort((a, b) =>
    E.rankOfId(b) - E.rankOfId(a) || a - b);
  const shown = sorted.slice(0, 5), rest = sorted.slice(5);
  const line = id => {
    const c = E.CHAR_BY_ID.get(id), f = E.fateOf(id, winners);
    return `<div class="fate ${f.won ? 'won' : 'lost'}">
      <b>${esc(c.name)}</b><span class="tag ${fac(c.factions[0]).cls}">${fac(c.factions[0]).name}</span>
      <span class="small" style="opacity:.6">${f.won ? 'あなたの側に' : 'あなたの外に'}</span><br>${esc(f.text)}</div>`;
  };
  return `<h3>その後の人々</h3>
    ${shown.map(line).join('')}
    ${rest.length ? `<p class="small">ほかに ${rest.map(id => esc(E.CHAR_BY_ID.get(id).name)).join('・')} が、あなたの名を覚えている。</p>` : ''}
    ${st.banned.length ? `<p class="small" style="color:var(--shu)">${
      st.banned.map(id => esc(E.CHAR_BY_ID.get(id).name)).join('・')} とは、ついに言葉が通じなかった。</p>` : ''}`;
}

function saveBoxHTML(){
  return `<div class="panel"><h2>保存 / 共有</h2>
    <div class="small">このコードを控えれば、同じ盤面をいつでも再現できます。</div>
    <textarea readonly id="savebox">${esc(E.encodeSave(st))}</textarea>
    <div class="row"><button id="copy">コードをコピー</button><span id="copied" class="small"></span></div>
    <div class="small" style="opacity:.7">state hash: <code class="seed">${E.hashState(st)}</code></div>
  </div>`;
}

function wireSaveBox(){
  const b = document.getElementById('copy'), box = document.getElementById('savebox');
  if (!b || !box) return;
  b.onclick = async () => {
    box.select();
    try { await navigator.clipboard.writeText(box.value); }
    catch { document.execCommand('copy'); }
    document.getElementById('copied').textContent = 'コピーしました';
  };
}

function render(){
  ({ title:viewTitle, meeting:viewMeeting, stance:viewStance, cards:viewCards,
     duel:viewDuel, result:viewResult, ending:viewEnding })[ui.screen]();
  wireSaveBox();
  /* Enter / Space でも押せるようにする（role="button" を付けた要素すべて） */
  app.querySelectorAll('[role="button"]').forEach(el => el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
  app.insertAdjacentHTML('beforeend', CREDIT);
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
