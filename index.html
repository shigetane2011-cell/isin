/* どの働きかけが誰に響くのかの早見表。人物ごとの情報ではなく規則そのものを、
   選ぶその場で読めるようにする。APPROACH_BY_MOTIVE から作るので規則と食い違わない。 */
function approachLegendHTML(mark){
  const by = E.APPROACHES.map(() => []);
  E.APPROACH_BY_MOTIVE.forEach((ap, m) => by[ap].push(E.CATS[0].motives[m]));
  return `<details class="detail legend"><summary>どの当たり方が誰に響くか</summary>
    ${E.APPROACHES.map((a, i) => `<div class="${mark === i ? 'hit' : ''}">${
      mark === i ? '◎ ' : '・'}<b>${esc(a.name)}</b> ─ ${
      by[i].map(esc).join('／')} を欲する者に響く</div>`).join('')}
    <div class="small">面会中の問いは<b>不正解を一つ消して二択にする</b>ものです。
      正解は【情勢】の描写から読むか、一局一度の「さらに聞き出す」で確かめられます。</div></details>`;
}

/* 縁の表示。面会の札でも、相手と向き合う画面でも同じものを出す。
   said を渡すと、同じ画面で言い回しが重なったときに台詞を省いて短い形にする。 */
function tieHTML(id, wb, said){
  const line = (cls, who, say, note) => {
    const dup = said && said.has(say);
    if (said) said.add(say);
    return `<div class="tie ${cls}"><span class="who">〔${esc(who)}〕</span>${dup ? '' : esc(say)}
      <span class="small">※ ${note}</span></div>`;
  };
  const vb = E.vouchOf(st, id);
  if (vb >= 0){
    const v = E.CHAR_BY_ID.get(vb).name;
    return line('', `${v}の紹介`, E.tieSay(st, id, vb, 'vouch'),
      `${esc(v)}の顔が立つ。${wb >= 0 ? `〔${fac(wb).name}〕への警戒を受けずに済む` : '旗色を警戒されない'}`);
  }
  const gb = E.grudgeOf(st, id);
  if (gb >= 0){
    const g = E.CHAR_BY_ID.get(gb).name;
    return line('bad', `${g}の縁者`, E.tieSay(st, id, gb, 'grudge'),
      '決裂させた噂が先に届いている。判定が一段下がります');
  }
  return '';
}

/* --- 画面: 面会 ---------------------------------------------------------- */
function viewMeeting(){
  if (st.finished && ui.interludePicked === null) { ui.screen = 'ending'; return viewEnding(); }
  if (E.pendingInterlude(st) || ui.interludePicked !== null) return viewInterlude();
  /* どの遷移で来ても、いま行ける場に居ないなら行き先選択へ戻す。
     連泊の禁止（placesOpen が直前の場を外す）を画面側で取りこぼさないための番人 */
  if (ui.place !== null && !E.placesOpen(st).includes(ui.place)) ui.place = null;
  /* 行き先と面会候補は同じ画面にまとめる。未定なら先頭の場を仮に選んでおく。 */
  const openPlaces = guidedTurn() ? [0] : E.placesOpen(st);
  if (ui.place === null || !openPlaces.includes(ui.place)) ui.place = openPlaces[0];
  const lockedPlaces = guidedTurn() ? [] : E.PLACES.map((p, i) => i).filter(i => !openPlaces.includes(i));
  const m = E.meetingList(st, ui.place);
  const era = E.eraOf(st);
  const pl = E.PLACES[ui.place];
  const fatigue = E.travelFatigue(st.lastPlace, ui.place);
  const from = st.lastPlace == null ? null : E.PLACES[st.lastPlace];
  const seats = E.PLACE_SEATS[ui.place], shown = E.normalMeetingCount(st, ui.place);
  const travelNote = fatigue
    ? (shown < seats
      ? ruleHTML('fatigue', `遠路を直行：通常枠 ${seats}→${shown}名`,
          `<b>遠路を直行：</b>${esc(from.where)}から${esc(pl.where)}へ一息に移るため旅疲れ。
          <b>通常枠が${seats}名から${shown}名へ減ります</b>（人脈の紹介・再訪・来訪は別枠なので、札はこれより多く並びます）。`, 'travel-note')
      : `<div class="travel-note safe"><b>遠路を直行：</b>${esc(from.where)}から${esc(pl.where)}へ一息に移りますが、ここはもともと${seats}名しか通されないため候補は減りません。</div>`)
    : pl.where === '街道'
      ? `<div class="travel-note safe"><b>街道を中継：</b>今夜はここで面会します。次に京・江戸・長崎へ入るときは旅疲れを受けません。</div>`
      : from?.where === '街道'
        ? `<div class="travel-note safe"><b>街道経由：</b>道中を一晩かけたため、旅疲れなく${esc(pl.where)}へ入れます。</div>` : '';
  const pfa = fac(pl.favor[0]).key, pfb = fac(pl.favor[pl.favor.length - 1]).key;
  const saidTies = new Set();          // 同じ画面で縁の台詞が重ならないように
  const card = (id, isIntro, isRevisit) => {
    const c = E.CHAR_BY_ID.get(id), rk = E.rankOfId(id);
    const fl = c.factions.map(f => `<span class="tag ${fac(f).cls}">${fac(f).name}</span>`).join('');
    const pre = rk > era
      ? `<div class="warn">※ 時期尚早：世論が熟しておらず、動かしても影響は限定的です（初級相当に制限）</div>` : '';
    const hot = E.HOTHEADS.has(id)
      ? `<div class="warn">※ 気が短い。転向を仕掛ければ刃が出る。応じ方を誤れば手傷を負う</div>` : '';
    const wb = E.waryOf(st.currents, id, st.chaos);
    /* 縁は判定に効く。紹介の顔が立てば旗色の警戒も悪評も通らない */
    const tie = tieHTML(id, wb, saidTies);
    const wary = (wb >= 0 && E.vouchOf(st, id) < 0)
      ? `<div class="warn">※ あなたが掲げる〔${fac(wb).name}〕を警戒している。判定が一段下がります</div>` : '';
    const again = isRevisit
      ? `<div class="tie bad"><span class="who">〔再訪〕</span>${esc(E.revisitSay(st, id))}
         <span class="small">※ 一度決裂した相手。<b>説き伏せれば和解し</b>、出現停止が解けて人脈に加わる</span></div>` : '';
    return `<div class="person ${E.PORTRAITS.has(id)?'has-portrait':''} ${isIntro?'intro':''} ${isRevisit?'revisit':''}" style="${toneStyle(c.factions)}" data-id="${id}" role="button" tabindex="0">
      ${portraitThumbHTML(id)}
      <div><span class="slotmark ${isRevisit ? 'revisit' : isIntro ? 'intro' : 'normal'}">${
        isRevisit ? '再訪' : isIntro ? '人脈の紹介' : '通常枠'}</span><span class="nm">${esc(c.name)}</span><span class="tag">${E.RANKS[rk]}</span>${fl}</div>
      <div class="nick">— ${esc(c.nick)} —</div>
      <div class="desc">${esc(c.desc)}</div>
      ${again}${isRevisit ? '' : tie}${pre}${isRevisit ? '' : wary}${hot}</div>`;
  };
  app.innerHTML = headerHTML() + chartHTML(true) +
    `<div class="panel"><h2>どこへ行き、誰に会うか</h2>
      <div class="placebar">
        ${ruleHTML('place', '行き先の決め方',
          '行き先を選ぶと、下の面会候補もそのまま入れ替わります。人物を選ぶまでは何度でも変更できます。都市間の直行は候補−1、街道を挟めば減りません。', 'small')}
        <div class="chiprow">${openPlaces.map(i => {
          const q = E.PLACES[i];
          const tired = E.travelFatigue(st.lastPlace, i);
          const n = E.normalMeetingCount(st, i);
          return `<button class="placechip ${i === ui.place ? 'on' : ''}" data-place="${i}"${
            q.hot ? ' data-hot="1"' : ''}><span class="nm">${esc(q.name)}</span>
            <span class="small">${q.favor.map(f => `<span class="${fac(f).cls}">${fac(f).name}</span>`).join('・')}${
              q.hot ? '・<span style="color:var(--shu)">荒事</span>' : ''}・候補${n}名</span>${
              tired && n < E.PLACE_SEATS[i] ? '<span class="travel">遠路・候補 −1</span>' : ''}</button>`;
        }).join('')}</div>
        ${lockedPlaces.length ? `<div class="small locked">${lockedPlaces.map(i =>
          `${esc(E.PLACES[i].name)}（${i === st.lastPlace ? '昨日も通った'
            : E.ERAS[E.PLACES[i].unlockEra] + 'から'}）`).join('　')}</div>` : ''}
      </div>
      <div class="here" style="--pf-a:var(--${pfa});--pf-b:var(--${pfb})">
        <div><span class="lbl">${st.lastPlace === null ? '最初の行き先' : '選択中の行き先'}</span><span class="nm">${esc(pl.name)}</span><span class="tag">${esc(pl.where)}</span></div>
        <div class="desc">${esc(pl.desc)}</div>
        <div class="allowbar">${pl.allow.map(a =>
          `<span class="ap ${a === pl.boost ? 'on' : ''}">${a === pl.boost ? '◎ ' : ''}${esc(E.APPROACHES[a].name)}</span>`).join('')}
          ${E.APPROACHES.map((a, i) => pl.allow.includes(i) ? '' :
            `<span class="ap off">${esc(a.name)}</span>`).join('')}</div>
        ${travelNote}
      </div>
      ${guidedTurn() ? coachHTML('一', '行き先と相手を決める', '毎ターン、行き先と面会相手をここで決めます。場によって集まる者と、できる働きかけが変わります。練習では祇園の茶屋に固定し、相手は自由に選べます。まずは各人物の<b>【情勢】</b>を読み比べてください。') : ''}
      ${(() => {
        const extra = [];
        if (E.visitOf(st)) extra.push('来訪 1名');
        if (m.intro) extra.push('人脈の紹介 1名');
        if (m.revisit >= 0) extra.push('再訪 1名');
        return `<div class="lineup"><span class="lbl">この場の顔ぶれ</span>
          <b>通常枠 ${m.normal.length}名</b>${fatigue && shown < seats ? `（遠路の旅疲れで −1）` : ''}${
          extra.length ? '　＋　' + extra.join('　＋　') : ''}
          <span class="small">＝ 札 ${m.normal.length + extra.length}枚</span></div>`;
      })()}
      ${(() => {
        const v = E.visitOf(st);
        if (!v) return '';
        const g = E.CHAR_BY_ID.get(v.guest), h = E.CHAR_BY_ID.get(v.host);
        const rk = E.rankOfId(v.guest);
        return `<div class="person visit ${E.PORTRAITS.has(v.guest)?'has-portrait':''}" style="${
          toneStyle(g.factions)}" data-id="${v.guest}" data-visit="1" role="button" tabindex="0">
          ${portraitThumbHTML(v.guest)}
          <div><span class="slotmark visit">来訪</span><span class="nm">${esc(g.name)}</span><span class="tag">${E.RANKS[rk]}</span>${
            g.factions.map(f => `<span class="tag ${fac(f).cls}">${fac(f).name}</span>`).join('')}</div>
          <div class="nick">— ${esc(g.nick)} —</div>
          <div class="tie"><span class="who">〔${esc(h.name)}の来訪〕</span>${esc(v.say)}</div>
          <div class="desc">${esc(g.desc)}</div>
          ${ruleHTML('visit', '応じれば移動なし・四手すべて使える・場の◎はなし',
            `<b>応じれば移動しません。</b>旅疲れを受けず、
            <b>場の縛りもないので四つの働きかけがすべて使えます</b>。${esc(h.name)}の顔が立つので警戒も悪評も通りません。
            ただし<b>場の◎（獲得+1）は乗らず</b>、他の候補は選べません。`, 'small visit-note')}
        </div>`;
      })()}
      ${m.normal.map(id => card(id, false)).join('')}
      ${m.intro ? card(m.intro, true) : ''}
      ${m.revisit >= 0 ? card(m.revisit, false, true) : ''}
      <details class="detail"><summary>この顔ぶれが選ばれた理由</summary>
        <div class="small">前ターンに組み上げた論証文の<b>${st.lastLen}字</b>×<b>${st.turn}</b>ターン、その剰余から基点ID <b>${m.base}</b> が決まり、
        いま会える者を並べたうえでその基点から${m.normal.length}名が選ばれています。${fatigue ? '遠路を直行した旅疲れで、通常枠が1名減っています。' : ''}時代が進むまでは高位の人物が初級へ丸められます。あなたが選んだ言葉が、次に会う人を変えています。</div>
      </details>
    </div>`;
  app.querySelectorAll('[data-place]').forEach(el => el.onclick = () => {
    ui.place = +el.dataset.place; render();
  });
  app.querySelectorAll('.person').forEach(el => el.onclick = () => {
    if (el.dataset.id === undefined) return;
    ui.charId = +el.dataset.id; ui.intro = el.classList.contains('intro');
    /* 来訪に応じた手は場を持たない。働きかけの縛りも旅疲れも掛からない */
    if (el.dataset.visit) ui.place = null;
    ui.stance = null; ui.ownF = null; ui.argueF = null;
    ui.picks = [null,null,null]; ui.approach = null;
    /* 調べ札は手番のもの。人物を選び直しても戻さない（戻すと何度でも調べられた） */
    ui.screen = 'stance'; render();
  });
}

/* --- 画面: 幕間「政変」 --------------------------------------------------- */
function viewInterlude(){
  const iv = ui.interludeData || E.pendingInterlude(st);
  ui.interludeData = iv;
  const picked = ui.interludePicked;
  const body = picked === null
    ? `<div class="row" style="display:block">${iv.opts.map((o, i) =>
        `<button class="choice" data-pick="${i}">${esc(o.label)}</button>`).join('')}</div>
       <div class="small" style="margin-top:10px;opacity:.7">正解はありません。どれを選ぶかが、あなたの立場です。</div>`
    : `<div class="say" style="border-left-color:var(--shu)"><span class="q">「${esc(iv.opts[picked].label)}」</span><br>${
        esc(iv.opts[picked].res)}</div>
       ${standingChangeHTML(ui.interludeStandingBefore, ui.interludeStandingAfter)}
       <div class="row"><button class="primary" id="ilnext">続ける</button></div>`;
  app.innerHTML = headerHTML() +
    `<div class="panel interlude tone-panel" style="${toneStyle(iv.key.split('+').map(Number))}">
      <div class="kind">幕間 ― 第${iv.turn}ターン（${iv.last ? '後編' : '前編'}）</div>
      <div class="title">『${esc(iv.title)}』</div>
      ${iv.prev ? `<div class="say" style="border-left-color:var(--sumi2)">
        あの『${esc(iv.prev.title)}』で、あなたは<b>${esc(iv.prev.tag)}</b>。その余波は、まだ収まっていない。</div>` : ''}
      ${interludeFigureHTML(iv)}
      <p>${esc(iv.scene)}</p>
      ${body}
    </div>` + (picked === null ? '' : chartHTML(true));
  app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const i = +b.dataset.pick;
    ui.interludeStandingBefore = E.playerStanding(st);
    st = E.applyInterlude(st, i);
    ui.interludeStandingAfter = E.playerStanding(st);
    ui.interludePicked = i; render();
  });
  const nx = document.getElementById('ilnext');
  if (nx) nx.onclick = () => {
    ui.interludePicked = null; ui.interludeData = null; ui.place = null; ui.probe = freshProbe();
    ui.interludeStandingBefore = null; ui.interludeStandingAfter = null;
    ui.screen = st.finished ? 'ending' : 'meeting'; render();
  };
}

/* --- 画面: 立場の決定 ----------------------------------------------------- */
function viewStance(){
  const c = E.CHAR_BY_ID.get(ui.charId);
  const activeFs = ui.ownF === null ? c.factions.slice() : [ui.ownF];
  let body = '';
  if (ui.ownF === null && c.factions.length > 1){
    body = `<p>${esc(c.name)}は複数の顔を持ちます。<b>どの属性に向き合いますか？</b></p>
      <div class="row">${c.factions.map(f =>
        `<button data-own="${f}">${fac(f).name}（${fac(f).full}）</button>`).join('')}</div>`;
  } else {
    if (ui.ownF === null) ui.ownF = c.factions[0];
    if (ui.stance === null){
      const wb2 = E.waryOf(st.currents, ui.charId, st.chaos);
      body = `<p>${esc(c.name)}〔${fac(ui.ownF).name}〕にどう臨みますか？</p>
        ${wb2 >= 0 && E.vouchOf(st, ui.charId) < 0
          ? `<div class="warn">この人物は、あなたが掲げる〔${fac(wb2).name}〕を警戒している。判定が一段下がる。</div>` : ''}
        <div class="row">
          <button class="primary" data-stance="support">支持する<span class="small">（${fac(ui.ownF).name}を伸ばす・2枚一致でも通る）</span></button>
          <button data-stance="convert" ${guidedTurn() ? 'disabled' : ''}>論破して転向させる<span class="small">（満点のみ・獲得<b>+2</b>と相手の勢力−2）</span></button>
        </div>
        ${E.HOTHEADS.has(ui.charId) ? '<div class="warn">この者は気が短い。<b>転向を仕掛ければ必ず刃が出る</b>。支持でも、通らなければ怒らせる。</div>' : ''}
        <details class="detail"><summary>支持と転向のちがい</summary>
          <div class="small"><b>支持</b>は一段下でも通る（さらに一段下なら「手応え」で時勢が1だけ動く）。
          だが伸びるのは相手の勢力〔${fac(ui.ownF).name}〕。<br>
          <b>転向</b>は攻撃。<b>満点でしか通らない</b>全か無かの賭けだが、通れば<b>支持より2多く</b>自分の掲げる勢力が伸び、相手の勢力を2削れる。
          一段でも下がれば通らないので、警戒や読み違えがあると札が刺さっても届かない。<br>
          <b>安全な手が一番得とは限りません。</b>方針を固定した自動対局では、論じる支持だけで通す打ち方が最も弱く、
          型の合う相手に肚を割る打ち方が最も強くなります。</div>
        </details>`;
    } else if (ui.stance === 'convert' && ui.argueF === null) {
      body = `<p><b>転向</b>を狙います。どの思想に引き込みますか？</p>
        <div class="row">${[0,1,2,3,4].filter(f => f !== ui.ownF).map(f =>
          `<button data-argue="${f}">${fac(f).name}（${fac(f).full}）</button>`).join('')}</div>`;
    } else {
      const left = E.PROBE_LIMIT - st.probesUsed;
      /* 利益提示を観た（または奥の手・練習で開いた）なら、そこから読める働きかけに印を付ける。
         印は「分かった型から筋どおりに読むとこれ」であって、働きかけ自体の正解ではない。
         そう見えて違う者が29名いる（その手掛かりは【情勢】の描写にある）。

         観ただけでは印が出ない作りにしていたため、所作から型を読めた人が
         それを働きかけに繋げられず、札を全部当てても肚を割るで落ちていた。
         札を三枚とも当てた転向のうち、型の読み違えで落ちるのが29.9%と最大の原因だった。 */
      const knownMotive = (deepOpen() || guidedTurn() || seenCat() === 0) ? c.correct[0] : null;
      const impliedAp = knownMotive === null ? -1 : E.APPROACH_BY_MOTIVE[knownMotive];
      body = `<p>どう働きかけますか？</p>
        ${approachLegendHTML(impliedAp)}
        ${knownMotive !== null ? `<div class="small" style="margin:8px 0">
          ${deepOpen() || guidedTurn() ? '聞き出したところ' : '所作を観たところ'}、この人物が欲しているのは <span class="uibadge">〔${
          esc(E.CATS[0].motives[knownMotive])}〕</span>。
          筋どおりなら <b>${esc(E.APPROACHES[impliedAp].name)}</b> が響きます
          <span style="opacity:.7">（そう見えて違う者もいます）</span></div>` : ''}
        ${(() => {
          /* スマホでは働きかけの一覧が画面上端から1400px下に出ており、しかも縦一列で
             論じるが常に先頭、肚を割るは最後だった。押しやすい手に寄るのは当然である。
             ① 響く手・場に合う手を先頭へ ② 使えない手は末尾へ ③ 印はボタン自身に出す。
             並べ替えても data-approach は実際の番号のままなので、判定には影響しない。 */
          /* 一度この画面を読んだ人には、四つの説明を一行ずつに縮める */
          const knowsApproaches = !guidedTurn() && hintsRead().has('approach');
          const rows = E.APPROACHES.map((a, i) => {
            const noGuide = guidedTurn() && i !== 0;
            const noPlace = ui.place !== null && !E.placeAllows(ui.place, i);
            const noConvert = ui.stance === 'convert' && !E.canConvert(i);
            const noProbe = i === 2 && left <= 0;
            const off = noGuide || noPlace || noConvert || noProbe;
            const why = noGuide ? '（練習では論じるに絞ります）'
                      : noPlace ? `（${esc(E.PLACES[ui.place].name)}ではできない）`
                      : noConvert ? '（転向は論じるか肚を割るでしか通らない）'
                      : noProbe ? '（奥の手を使い切っている）' : '';
            const hitsHim = !off && impliedAp === i;
            const hitsHere = !off && ui.place !== null && E.PLACES[ui.place].boost === i;
            return { a, i, off, why, hitsHim, hitsHere,
                     rank: off ? 3 : hitsHim ? 0 : hitsHere ? 1 : 2 };
          }).sort((x, y) => x.rank - y.rank || x.i - y.i);
          return `<div class="approach-grid">${rows.map(({ a, i, off, why, hitsHim, hitsHere }) =>
            `<button class="choice ${hitsHim ? 'hit-him' : hitsHere ? 'hit-here' : ''}" data-approach="${i}" ${off ? 'disabled' : ''}>
            <b>${esc(a.name)}</b>${a.cards === 3 ? '' : `　<span class="small cn">カード${a.cards}枚</span>`}
            ${hitsHim ? '<span class="small uibadge">　◎ この者に響く</span>' : ''}
            ${hitsHere ? '<span class="small uibadge">　◎ この場に合う</span>' : ''}
            ${ui.stance === 'convert' && i >= 2 && !off
              ? '<span class="small" style="color:var(--shu)">　※ 読み違えれば、札が刺さっても転向は通らない</span>' : ''}
            <span class="small" style="display:block;opacity:.8">${
              esc(knowsApproaches ? a.brief : a.desc)}${why}</span></button>`).join('')}</div>`;
        })()}
        ${ruleHTML('approach', '響けば獲得+1／金品と肚を割るは外すと一段下がる',
          '響けば獲得が1増えます。金品と肚を割るは<b>相手を読み切った前提の賭け</b>なので、外すと逆に一段下がります。', 'small')}`;
    }
  }
  const wb0 = E.waryOf(st.currents, ui.charId, st.chaos);

  /* 三項目とも並べて見せたら、読む仕事が消えて誰でも当たる（実測で勝率100%）。
     手掛かりの量ではなく「どこを調べるか」を選ばせるのが釣り合いの取れる形だった。
     観る＝一項目が読める／訊く＝一項目が二択になる／奥の手＝三項目とも開く。
     どれも一度きりなので、狙いを一点に寄せるか散らすかが毎回の判断になる。 */
  const open = deepOpen() || guidedTurn();
  const seeSpent = spentOn('see'), askSpent = spentOn('ask'), deepSpent = spentOn('deep');
  const probeLeft = E.PROBE_LIMIT - st.probesUsed;
  const chips = `
    <div class="slot-h">相手を調べる</div>
    ${ruleHTML('probe', '観ると訊くを一度ずつ',
      '<b>観る</b>はその項目の所作を読ませ、<b>訊く</b>はその項目の不正解を一つ消して二択にします。どちらも<b>一度ずつ</b>。同じ項目に重ねて一つを確実にするか、散らして二つを半分ずつ掴むかを選びます。', 'small')}
    <div class="probe-table">
      ${E.CATS.map((cat, i) => {
        const seen = open || seenCat() === i, asked = open || askedCat() === i;
        return `<div class="prow">
          <div class="phead"><b>${i+1}. ${esc(cat.name)}</b><span class="small">${esc(cat.hint)}</span></div>
          <div class="pacts">
            ${seen ? '<span class="chip used">観た</span>'
              : seenCat() !== null || seeSpent ? `<span class="chip spent">観る</span>`
              : `<button class="chip" data-see="${i}">観る</button>`}
            ${asked ? '<span class="chip used">訊いた</span>'
              : askedCat() !== null || askSpent ? `<span class="chip spent">訊く</span>`
              : `<button class="chip" data-ask="${i}">訊く</button>`}
          </div>
          ${seen ? `<div class="gest">${esc(E.gestureOf(ui.charId, i))}</div>` : ''}
          ${asked ? dialogueReplyHTML(c, i, open) : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="row">
      ${guidedTurn()
        ? '<span class="probed">練習中 — 三つとも開示しています（回数は消費しません）</span>'
        : deepOpen()
        ? '<span class="probed">◎ 奥の手で残らず聞き出した — この交渉の獲得は 1 下がる</span>'
        : deepSpent
        ? `<span class="probed" style="opacity:.7">この手番の奥の手は${esc(deepSpent)}に使った（回数は交渉が成立するまで引かれない）</span>`
        : probeLeft > 0
          ? `<button class="probe" id="probe">さらに聞き出す<span class="small">（一局に一度の奥の手・三項目とも開く・この交渉の獲得 −1）</span></button>`
          : '<span class="probed" style="opacity:.6">この一局の奥の手は、すでに使った</span>'}
    </div>
    ${(() => {
      const n = E.NOTES.get(ui.charId);
      if (!n) return '';
      return `<details class="detail yowa"><summary>余話 ― 史実のこの人物</summary>
        <div class="small" style="margin-top:6px">${esc(n.note)}</div>
        ${n.works ? `<div class="small" style="margin-top:6px;color:var(--kin)">関連作品：${esc(n.works)}</div>` : ''}
        ${n.spot ? `<div class="small" style="margin-top:6px">ゆかりの地：<a class="spot" href="https://www.google.com/maps/search/?api=1&amp;query=${
          encodeURIComponent(n.spot)}" target="_blank" rel="noopener noreferrer">${esc(n.spot)} を地図で見る ↗</a></div>` : ''}
        <div class="small" style="margin-top:6px;opacity:.6">※ 史実の記述です。ゲーム上の「刺さる型」とは別ですが、読み解きの助けにはなります。地図リンクは押したときだけ外部サイトを開きます。</div>
      </details>`;
    })()}`;

  const guide = guidedTurn()
    ? ui.ownF === null && c.factions.length > 1
      ? coachHTML('三', '向き合う属性を決める', `${esc(c.name)}は複数の勢力に属します。練習で読み解く側面を一つ選んでください。`)
      : coachHTML('三', 'まずは支持と「論じる」で仕組みを覚える', '支持は<b>3枚中2枚一致でも成功</b>します。練習では転向と、論じる以外の働きかけを封じ、次の画面で正解と根拠を見ながら3枚を組みます。')
    : '';

  /* 面会の入り口で、ブロックの順と有無そのものを変える。急かされていれば
     世間話も情勢の一言も出ない。同じ順で同じ7つを並べ続けたのが一本調子の原因だった。 */
  const sit = E.situationOf(st, ui.charId, ui.place);
  const BLOCK = {
    scene: () => `<div class="scene">${esc(E.sceneSayOf(st, ui.charId, ui.place))}</div>`,
    tie:   () => st.banned.includes(ui.charId)
        ? `<div class="tie bad"><span class="who">〔再訪〕</span>${esc(E.revisitSay(st, ui.charId))}
           <span class="small">※ 一度決裂した相手。説き伏せれば和解する</span></div>`
        : tieHTML(ui.charId, E.waryOf(st.currents, ui.charId, st.chaos)),
    open:  () => `<div class="opening">「${esc(E.SAYS.get(ui.charId) || '')}」</div>`,
    recv:  () => `<div class="opening reception r${E.receptionKind(st.origin, ui.charId)}">「${
        esc(E.receptionOf(st.origin, ui.charId))}」</div>`,
    sit:   () => sit ? `<div class="opening sit">「── ${esc(sit.text)}」</div>` : '',
    world: () => `<div class="say worldview">${
        esc(E.SMALLTALK[0].lines[ui.ownF ?? c.factions[0]][E.TONE_OF_VOICE[E.voiceOf(ui.charId)]])}</div>`,
    chips: () => chips,
  };
  const order = E.SCENE_ORDER[E.sceneOf(st, ui.charId, ui.place)];
  const descAt = order.indexOf('chips');  /* 人物紹介は「調べる」の直前に挟む */
  /* 立場を決めたあとは、場面の描写を畳んで決定へ寄せる。読み返したければ開ける。
     縦を食っているのは規則文ではなく、決定のたびに全部残るこの場面ブロックだった。 */
  const settled = ui.stance !== null && !guidedTurn();
  const scene = order.slice(0, descAt).map(k => BLOCK[k]()).join('')
    + `${guide}<div class="quote">${esc(c.desc)}</div>`;
  app.innerHTML = headerHTML() + characterVisualHTML(c, true) +
    `<div class="panel tone-panel" style="${toneStyle(activeFs)}"><h2>${esc(c.name)} — ${esc(c.nick)}</h2>
      ${settled
        ? `<details class="scene-fold"><summary>${esc(c.name)}との場面をもう一度読む</summary>${scene}</details>`
        : scene}
      ${order.slice(descAt).map(k => BLOCK[k]()).join('')}<hr id="decide">${body}
      <div class="row" style="margin-top:14px"><button id="back">面会相手を選び直す</button></div>
    </div>`;
  app.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => {
    ui.probe.ask = { charId: ui.charId, cat: +b.dataset.ask }; render(); });
  app.querySelectorAll('[data-see]').forEach(b => b.onclick = () => {
    ui.probe.see = { charId: ui.charId, cat: +b.dataset.see }; render(); });
  const pb0 = document.getElementById('probe');
  if (pb0) pb0.onclick = () => { ui.probe.deep = { charId: ui.charId }; render(); };
  /* 面会画面は長い。スマホでは働きかけの一覧が画面上端から1400px下に出るので、
     画面内で選ぶたびに、次の選択へ視線を移してやる。最初の表示では動かさない。 */
  const toDecision = () => { render(); document.getElementById('decide')?.scrollIntoView({ block:'start' }); };
  app.querySelectorAll('[data-own]').forEach(b => b.onclick = () => { ui.ownF = +b.dataset.own; toDecision(); });
  app.querySelectorAll('[data-stance]').forEach(b => b.onclick = () => {
    ui.stance = b.dataset.stance;
    if (ui.stance === 'support') ui.argueF = ui.ownF;
    toDecision();
  });
  app.querySelectorAll('[data-argue]').forEach(b => b.onclick = () => { ui.argueF = +b.dataset.argue; toDecision(); });
  app.querySelectorAll('[data-approach]').forEach(b => b.onclick = () => {
    ui.approach = +b.dataset.approach; ui.screen = 'cards'; render();
  });
  document.getElementById('back').onclick = () => { ui.screen = 'meeting'; render(); };
}

/* --- 画面: 論証の組み立て ------------------------------------------------- */
function viewCards(){
  const c = E.CHAR_BY_ID.get(ui.charId);
  ui.opts = E.cardOptions(st, ui.charId, ui.argueF);
  const guided = guidedTurn();
  const nCards = E.APPROACHES[ui.approach].cards;
  const ready = [0,1,2].slice(0, nCards).every(i => ui.picks[i] !== null);
  const left = E.PROBE_LIMIT - st.probesUsed;
  const text = ready ? E.argumentFor(st, { charId: ui.charId, argueF: ui.argueF,
    cards: ui.picks, approach: ui.approach, place: ui.place }) : '';
  app.innerHTML = headerHTML() +
    `<div class="panel tone-panel" style="${toneStyle([ui.argueF])}"><h2>${esc(c.name)}を${ui.stance === 'support' ? '支持する' : `${fac(ui.argueF).name}へ転向させる`}</h2>
      <div class="quote">${esc(c.desc)}</div>
      <div class="small">語る言葉は〔${fac(ui.argueF).name}〕の思想のもの。だが<b>刺さるかどうかは、相手が何を欲しているか</b>で決まります。</div>
      ${guided ? coachHTML('三', '正解と根拠を見て三枚を組む', 'この1ターンだけ、正解のカードを金色で示し、通常は一つしか聞けない<b>三つの返答</b>を根拠として開示します。金色のカードを一枚ずつ選んでください。') : ''}
      ${askedCat() !== null ? dialogueReplyHTML(c, askedCat(), deepOpen() || guided) : ''}
      ${(() => {
        /* 踏み切る前に、いま効いている減点をここに全部並べる。面会画面にしか出ていない
           ものがあると「札は全部当てたのに落ちた」の理由が後からしか分からない。 */
        const vouched = E.vouchOf(st, ui.charId) >= 0;
        const wb = E.waryOf(st.currents, ui.charId, st.chaos), gb = E.grudgeOf(st, ui.charId);
        const steps = [];
        if (!vouched && wb >= 0) steps.push(`あなたの掲げる〔${fac(wb).name}〕への<b>警戒</b>`);
        if (!vouched && gb >= 0) steps.push(`${esc(E.CHAR_BY_ID.get(gb).name)}を決裂させた<b>噂</b>`);
        const stepHTML = steps.length
          ? `<div class="warn">${steps.join('と')}で、<b>判定は${steps.length}段下がります</b>${
              vouched ? '' : ''}。</div>` : '';
        if (ui.stance !== 'convert') return stepHTML;
        return `<div class="warn">転向は<b>満点でしか通りません</b>。この働きかけで置くのは${nCards}枚、そのすべてが刺さって満点です。
          通れば<b>獲得+2</b>と相手の勢力−2が付きます。${
          ui.approach >= 2 ? `<br>さらに<b>${esc(E.APPROACHES[ui.approach].name)}は相手を読み切った前提の賭け</b>です。
          <b>この人物が欲しているもの</b>を読み違えていれば一段下がり、
          置いた札が刺さっていても転向には届きません。` : ''}${
          steps.length ? `<br>いまこの相手には${steps.join('と')}が効いています。
            <b>札を${nCards}枚とも当てても転向は通りません。</b>支持なら通ります。` : ''}</div>${stepHTML}`;
      })()}
      <div class="row" style="margin-top:12px">
        ${guided
          ? '<span class="probed">練習中 — 三つとも開示しています</span>'
          : deepOpen()
          ? '<span class="probed">◎ 奥の手で残らず聞き出した — この交渉の獲得は 1 下がる</span>'
          : `<span class="probed" style="opacity:.6">読み切れないときは、<b>戻る</b>と一局に一度の「さらに聞き出す」が使えます（残り ${left} 回）</span>`}
      </div>
      <div class="pre">切り出し：「${esc(E.preambleOf(st, ui.charId, ui.place))} ──」</div>
      ${E.CATS.slice(0, nCards).map((cat, i) => `
        <div class="slot-h">${i+1}. ${cat.name} <span style="opacity:.7">— ${cat.hint}</span></div>
        ${i === 0 ? ruleHTML('cards', '〔　〕＝その札が訴えかける先',
          '〔　〕はその札が訴えかける先。この人物が何を欲しているかを当てます。', 'small') : ''}
        ${seenCat() === i || deepOpen() || guided
          ? `<div class="slot-gest">${esc(E.gestureOf(ui.charId, i))}</div>` : ''}
        <div class="card-grid">${ui.opts[i].map(o => {
          const isCorrect = o.motive === c.correct[i];
          const isAns = (deepOpen() || guided) && isCorrect;
          const isRuledOut = !deepOpen() && !guided && askedCat() === i
            && o.motive === E.deniedMotiveOf(st, ui.charId, i);
          const guideClass = guided ? (isCorrect ? 'guide-answer' : 'guide-decoy') : '';
          const disabled = (guided && !isCorrect) || isRuledOut;
          return `<div class="card ${ui.picks[i]===o.motive?'sel':''} ${isAns?'ans':''} ${guideClass} ${isRuledOut?'ruled-out':''}" data-cat="${i}" data-m="${o.motive}" role="button" tabindex="${disabled ? '-1' : '0'}" aria-disabled="${disabled}" aria-pressed="${ui.picks[i]===o.motive}">${
            isRuledOut ? '<span class="ruled-mark">× 本人が否定した</span>' : ''}${
            isAns ? `<span class="mark">◎ ${guided ? '練習の正解' : 'これが刺さる'}</span> ` : ''
          }<span class="mv">〔${esc(E.CATS[i].motives[o.motive])}〕</span>${esc(o.text)}${
            guided && isCorrect ? tutorialReasonHTML(c, i) : ''}</div>`;
        }).join('')}</div>
      `).join('')}
      ${ready ? `<div class="slot-h">組み上がった論証（${Array.from(text).length} 字）</div>
        <div class="quote">「${esc(text)}」</div>` : ''}

      <div class="row">
        <button class="primary" id="go" ${ready?'':'disabled'}>${guided ? '正解の論で臨む' : 'この論で臨む'}</button>
        <button id="back">戻る</button>
      </div>
    </div>`;
  app.querySelectorAll('.card').forEach(el => el.onclick = () => {
    const cat = +el.dataset.cat, motive = +el.dataset.m;
    if (guided && motive !== c.correct[cat]) return;
    if (!deepOpen() && askedCat() === cat && motive === E.deniedMotiveOf(st, ui.charId, cat)) return;
    ui.picks[cat] = motive; render();
  });
  document.getElementById('back').onclick = () => { ui.approach = null; ui.screen = 'stance'; render(); };
  document.getElementById('go').onclick = () => {
    const a = { charId: ui.charId, stance: ui.stance, ownF: ui.ownF, argueF: ui.argueF,
                cards: ui.picks.map(v => v === null ? 0 : v), probed: deepOpen(),
                asked: askedCat(), approach: ui.approach, place: ui.place };
    /* 刃が出ても画面は変えない。結果の流れの中で応じ方を訊く。 */
    if (E.duelPending(st, a)){ ui.duelAction = a; ui.report = null; ui.screen = 'result'; render(); return; }
    const r = E.resolve(st, a);
    st = r.next; ui.report = r.report; ui.screen = 'result'; render();
  };
}

/* --- 画面: 結果（刃が出た場合は、その応じ方から） --------------------------- */
/* 立ち合いは別画面をやめた。交渉の結果を見にいく途中で刃が出る、という一続きにする。
   組み上げた論証をそのまま上に残すので、何を言った結果こうなったのかが切れない。 */
function viewDuelInline(){
  const a = ui.duelAction, c = E.CHAR_BY_ID.get(a.charId);
  const text = E.argumentFor(st, a);
  app.innerHTML = headerHTML() + meetingVisualHTML(c) +
    `<div class="panel duel">
      <div class="kind">立ち合い</div>
      <div class="title">${esc(c.name)}が刀に手をかけた</div>
      <div class="quote">「${esc(text)}」</div>
      <p>${a.stance === 'convert'
        ? `言い分がどうであれ、${esc(c.name)}は柄に手をかけた。転向を迫るとは、そういうことだ。`
        : `見え透いた世辞と受け取られた。${esc(c.name)}の目つきが変わり、柄に手がかかる。`}間合いは、もう詰まっている。</p>
      <div class="row" style="display:block">${E.DUELS.map((d, i) =>
        `<button class="choice" data-duel="${i}">${esc(d.label)}</button>`).join('')}</div>
      <div class="small" style="margin-top:10px;opacity:.7">この者に何が通じるか ―― 望んでいるものを思い出せ。</div>
    </div>`;
  app.querySelectorAll('[data-duel]').forEach(b => b.onclick = () => {
    const r = E.resolve(st, Object.assign({}, a, { duel: +b.dataset.duel }));
    st = r.next; ui.report = r.report; ui.duelAction = null; render();
  });
}

/* --- 画面: 結果 ---------------------------------------------------------- */
function viewResult(){
  if (ui.duelAction && !ui.report) return viewDuelInline();
  const r = ui.report, c = E.CHAR_BY_ID.get(r.charId);
  const guidedResult = !!(ui.guidedTutorial && st.actions.length === 1);
  const marks = r.hits.slice(0, r.nCards).map((h,i) => `<div class="small">${h?'☑':'☐'} ${E.CATS[i].name}：${
    h ? (r.probed ? '刺さった（奥の手で聞き出した）'
                  : r.asked === i ? '刺さった（二択から見抜いた）' : '刺さった')
      : `外れ（この人物に効くのは「${E.CATS[i].motives[c.correct[i]]}」）`}</div>`).join('');
  const d = r.delta.map((v,i) => v ? `<span class="${fac(i).cls}">[${fac(i).name}] ${v>0?'+':''}${v}</span>` : null)
    .filter(Boolean).join('　') || '変動なし';
  app.innerHTML = headerHTML() +
    `<div class="result ${r.partial ? 'partial' : r.gain > 0 ? 'succeeded' : 'failed'}" style="${toneStyle([r.argueF])}">
      <div class="verdict v${r.score}">${r.verdict}</div>
      ${guidedResult ? coachHTML('完', '一手のチュートリアル完了', '三つの返答から刺さる三枚を読み、論証を組む流れは以上です。次のターンからは<b>一つの問いで不正解を一枚だけ除外</b>できます。残り二択は情勢描写から読むか、「さらに聞き出す」を使うか、賭けてください。') : ''}
      ${resultReactionHTML(c, r)}
      ${factionLegendHTML([r.argueF])}
      <div class="small" style="margin-top:4px">${esc(c.name)}（${E.RANKS[r.rank]}）に${
        r.stance==='support'?'賛意を示した':`${fac(r.argueF).name}への転向を迫った`}</div>
      <div class="quote">「${esc(r.text)}」</div>
      ${r.asked !== null && !r.probed ? `<div class="small">問い：本人が〔${esc(E.CATS[r.asked].motives[r.deniedMotive])}〕を否定したので、残り二択から選んだ</div>` : ''}
      ${marks}
      <div class="small" style="margin-top:4px">${r.place != null ? esc(E.PLACES[r.place].name) + '　' : ''}働きかけ：<b>${esc(E.APPROACHES[r.approach].name)}</b>${
        r.placeFits ? '　<span class="uibadge">◎ 場に合った（獲得+1）</span>' : ''}${
        r.fits ? '　<span class="uibadge">◎ この者に響いた（獲得+1）</span>'
               : r.approach >= 2 ? `　<span style="color:var(--shu)">読み違え ― この者が欲していたのは〔${esc(E.CATS[0].motives[c.correct[0]])}〕で、${esc(E.APPROACHES[r.approach].name)}は響かなかった（一段下がった）</span>` : ''}</div>
      ${r.duel ? `<div class="duelresult ${r.duel.survived ? 'won' : 'lost'}">
        <b>${esc(E.DUELS[r.duel.choice].label)}</b><br>${esc(r.duel.text)}
        <div class="small" style="margin-top:6px">${r.duel.survived
          ? '腕を認められ、この者は【人脈】に加わった。'
          : `手傷を負った。〔${fac(r.argueF).name}〕−3、一度きりの奥の手を失い、この者は二度と現れない。`}</div>
      </div>` : ''}
      ${r.probed && r.gain > 0 ? `<div class="warn">※ 奥の手で聞き出したため、獲得が ${r.gainBeforeProbe} から ${r.gain} に下がりました（奥の手は使用済み）</div>` : ''}
      ${r.waryApplied ? `<div class="warn">※ あなたの掲げる〔${fac(r.waryBy).name}〕への警戒により、${r.rawScore}枚一致が一段下げられました</div>` : ''}
      ${r.vouchedBy >= 0 ? `<div class="small"><span class="uibadge">※ ${esc(E.CHAR_BY_ID.get(r.vouchedBy).name)}の紹介が効いた。</span>${
        r.waryBy >= 0 ? `〔${fac(r.waryBy).name}〕への警戒を受けずに済んだ` : 'この相手は端からあなたを門前払いしなかった'}</div>` : ''}
      ${r.grudgeApplied ? `<div class="warn">※ ${esc(E.CHAR_BY_ID.get(r.grudgedBy).name)}を決裂させた噂が先に届いており、判定が一段下げられました</div>` : ''}
      ${r.reconciled ? `<div class="vowline">→ <b>和解した。</b>${esc(c.name)}は出現停止を解かれ、【人脈】に加わった。
        一度断たれた縁が、つなぎ直された。</div>` : ''}
      ${(() => {
        if (!r.allOrNothing || r.score === 3) return '';
        const why = [];
        if (r.misfit) why.push(`この者が欲していたのは〔${esc(E.CATS[0].motives[c.correct[0]])}〕で、<b>${esc(E.APPROACHES[r.approach].name)}は響かなかった</b>`);
        if (r.waryApplied) why.push(`〔${fac(r.waryBy).name}〕への<b>警戒</b>`);
        if (r.grudgeApplied) why.push(`<b>決裂の噂</b>が届いていた`);
        if (r.rawScore < r.nCards)
          return `<div class="warn">※ 転向は満点でしか通りません。置いた${r.nCards}枚のうち刺さったのは ${r.rawScore} 枚で、相手は動きませんでした</div>`;
        if (!why.length) return '';
        return `<div class="warn">※ <b>置いた${r.nCards}枚はすべて刺さっていました。</b>
          しかし${why.join('、')}ため判定が下がり、転向に必要な満点に届きませんでした。<br>
          転向は一段でも下がれば通りません。${r.score >= 2
            ? '<b>支持であれば、この一致で通っていました</b>' : ''}</div>`;
      })()}
      ${r.chaosGain ? `<div class="warn">※ <b>混沌 +${r.chaosGain}</b>（${
        r.chaosAdded.map(c => esc(c.text)).join('・')}）→ 合計 ${r.chaos}${
        r.waryLine < r.waryLineBefore
          ? `。<b>警戒線が ${r.waryLineBefore} から ${r.waryLine} へ下がりました</b> ―― この先、対立する勢力の人物はより早く身構えます`
          : ''}</div>` : ''}
      ${r.premature ? `<div class="warn">※ 時期尚早のため、${E.RANKS[r.rank]}級ですが影響力は限定的です（ランク補正を無効化）</div>` : ''}
      ${r.penalty ? `<div class="warn">※ ${E.RANKS[r.rank]}級との交渉に失敗し時勢 -${r.penalty}</div>` : ''}
      <div class="delta">${d}</div>
      ${standingChangeHTML(r.standingBefore, r.standingAfter)}
      ${r.partial ? `<div class="warn" style="color:var(--sumi2)">※ 刺さったのは1枚だけ。相手は動きませんでしたが、
        言葉は残りました（〔${fac(r.argueF).name}〕+1）。<b>人脈には加わりません</b>${
        r.penalty ? `。${E.RANKS[r.rank]}級を動かせなかった代償は、そのまま払います` : ''}</div>` : ''}
      ${r.contactAdded ? `<div class="small">→ ${esc(c.name)}が【人脈】に加わった。</div>` : ''}
      ${r.promised ? `<div class="vowline">→ 肚を割って〔${fac(r.promisedF).name}〕の旗を明かした。
        <b>${esc(c.name)}との約束が残る。</b>この旗が最後に採られていなければ、約束を違えたことになる。</div>` : ''}
      ${r.bannedNow ? `<div class="small">→ ${esc(c.name)}は激怒し、二度と現れない。<b>その縁筋も閉じた</b>（${
        [...(E.TIE_GRAPH.get(r.charId) || [])].slice(0, 4).map(i => esc(E.CHAR_BY_ID.get(i).name)).join('・') || '縁者なし'
      }${(E.TIE_GRAPH.get(r.charId)?.size || 0) > 4 ? ' ほか' : ''} からの紹介が絶えた）</div>` : ''}
      <div class="small" style="margin-top:8px;opacity:.7">この論証は ${r.len} 字。次の面会者はこの数から導かれます。</div>
    </div>` + chartHTML(true) +
    `<div class="row"><button class="primary" id="next">${st.finished?'結末を見る':guidedResult?'第2ターンへ（通常進行）':`第${st.turn}ターンへ`}</button></div>`
    + `<details class="detail savefold"><summary>この盤面を保存・共有する</summary>${saveBoxHTML()}</details>`;
  document.getElementById('next').onclick = () => {
    commitHints();
    if (guidedResult) ui.guidedTutorial = false;
    ui.place = null;                       // ターンが変われば行き先から選び直す
    ui.probe = freshProbe();               // 観る・訊く・奥の手も手番ごとに戻る
    ui.screen = st.finished ? 'ending' : 'meeting'; render();
  };
}

/* --- 画面: エンディング --------------------------------------------------- */
function playerEndingHTML(ending){
  const p = E.playerEpilogue(st, ending);
  const fs = p.factions.length ? p.factions : E.winningFactions(ending);
  return `<div class="final-standing" style="${toneStyle(fs)}">
    <div class="small">終局時のあなた</div>
    <div class="name">${esc(p.title)}</div>
    <div class="small" style="margin-top:5px">${esc(p.text)}</div>
  </div>`;
}
function viewEnding(){
  const e = E.evaluateEnding(st);
  const endingFs = E.winningFactions(e);
  const heads = ['国内政治','国際関係'];
  app.innerHTML = headerHTML() + chartHTML() +
    `<div class="panel ending tone-panel" style="${toneStyle(endingFs)}">
      <div class="kind">${e.kind==='solo'?'単独覇権エンド':e.kind==='combo'?'複合革命エンド':'混沌エンド'}</div>
      <div class="title">『${esc(e.t)}』</div>
      <div class="kind" style="color:var(--sumi2)">${esc(e.s)}</div>
      ${endingVisualHTML(e)}
      ${e.p.slice(0,2).map((para,i) => `<h3>${heads[i]}</h3><p>${esc(para)}</p>`).join('')}
      <h3>あなたが何者になったか</h3>
      ${playerEndingHTML(e)}
      <p>${esc(e.p[2])}</p>
      ${st.interlude ? `<h3>あの夜の選択</h3><p>『${esc(st.interlude.title)}』において、あなたは<b>${
        esc(st.interlude.tag)}</b>。<br>${esc(st.interlude.after || '')}</p>` : ''}
      ${promisesHTML(e)}
      ${epilogueHTML(e)}
    </div>` + saveBoxHTML() +
    `<div class="row"><button class="primary" id="again">最初から</button></div>`;
  document.getElementById('again').onclick = () => {
    st = null; ui.screen = 'title'; ui.guidedTutorial = false; ui.seedDraft = freshSeed();
    ui.interludeStandingBefore = null; ui.interludeStandingAfter = null; render();
  };
}

const CREDIT = `<hr><div class="small" style="text-align:center;opacity:.7;padding-bottom:20px">
  原案『維新の乱流 ― 幕末、日本の夜明けを設計せよ ―』ミッキーベルグ<br>
  本実装は原案のルールを、LLMを使わない決定論的プログラムとして再構成したものです。<br>
  史実を題材としたフィクションであり、人物像・勢力分類はゲーム上の解釈です。
</div>`;

/* 肚を割って交わした約束が、選んだ未来の中で果たされたか */
function promisesHTML(ending){
  if (!st.promises.length) return '';
  const pr = E.promiseReport(st, ending);
  const used = new Set();
  const line = (pm, kept) => {
    const c = E.CHAR_BY_ID.get(pm.id);
    let n = pm.id, t = E.promiseFate(pm.f, kept, n);
    for (let k = 0; k < 3 && used.has(t); k++) t = E.promiseFate(pm.f, kept, ++n);
    used.add(t);
    return `<div class="fate ${kept ? 'won' : 'lost'}">
      <b>${esc(c.name)}</b><span class="tag ${fac(pm.f).cls}">${fac(pm.f).name}</span>
      <span class="small" style="opacity:.6">${kept ? '果たした' : '違えた'}</span><br>${esc(t)}</div>`;
  };
  return `<h3>交わした約束</h3>
    <p class="small">肚を割って明かした旗は ${st.promises.length} 本。うち <b>${pr.kept.length} 本</b>を果たした。</p>
    ${pr.kept.map(pm => line(pm, true)).join('')}${pr.broken.map(pm => line(pm, false)).join('')}`;
}

/* 築いた人脈が、選んだ未来の中でどうなったか */
function epilogueHTML(ending){
  if (!st.contacts.length && !st.banned.length) return '';
  const winners = E.winningFactions(ending);
  const sorted = st.contacts.slice().sort((a, b) =>
    E.rankOfId(b) - E.rankOfId(a) || a - b);
  const shown = sorted.slice(0, 5), rest = sorted.slice(5);
  const vow = new Set(st.promises.map(pm => pm.id));
  const usedFate = new Set();
  const line = id => {
    const c = E.CHAR_BY_ID.get(id);
    let n = id, f = E.fateOf(id, winners, n);
    for (let k = 0; k < 3 && usedFate.has(f.text); k++) f = E.fateOf(id, winners, ++n);
    usedFate.add(f.text);
    return `<div class="fate ${f.won ? 'won' : 'lost'}">
      <b>${esc(c.name)}</b><span class="tag ${fac(c.factions[0]).cls}">${fac(c.factions[0]).name}</span>
      ${vow.has(id) ? '<span class="tag vow">約束</span>' : ''}
      <span class="small" style="opacity:.6">${f.won ? 'あなたの側に' : 'あなたの外に'}</span><br>${esc(f.text)}</div>`;
  };
  return `<h3>その後の人々</h3>
    ${shown.map(line).join('')}
    ${rest.length ? `<p class="small">ほかに ${rest.map(id => esc(E.CHAR_BY_ID.get(id).name)).join('・')} が、あなたの名を覚えている。</p>` : ''}
    ${st.banned.length ? `<p class="small" style="color:var(--shu)">${
      st.banned.map(id => esc(E.CHAR_BY_ID.get(id).name)).join('・')} とは、ついに言葉が通じなかった。</p>` : ''}`;
}

function saveBoxHTML(){
  return `<div class="panel"><h2>保存 / 共有</h2>
    <div class="small">このコードを控えれば、同じ盤面をいつでも再現できます（seed <code class="seed">${st.seed}</code>）。</div>
    <textarea readonly id="savebox">${esc(E.encodeSave(st))}</textarea>
    <div class="row"><button id="copy">コードをコピー</button><span id="copied" class="small"></span></div>
    <div class="small" style="opacity:.7">state hash: <code class="seed">${E.hashState(st)}</code></div>
  </div>`;
}

function wireSaveBox(){
  const b = document.getElementById('copy'), box = document.getElementById('savebox');
  if (!b || !box) return;
  b.onclick = async () => {
    box.select();
    try { await navigator.clipboard.writeText(box.value); }
    catch { document.execCommand('copy'); }
    document.getElementById('copied').textContent = 'コピーしました';
  };
}

function render(){
  ({ title:viewTitle, meeting:viewMeeting, stance:viewStance, cards:viewCards,
     result:viewResult, ending:viewEnding })[ui.screen]();
  wireSaveBox();
  /* Enter / Space でも押せるようにする（role="button" を付けた要素すべて） */
  app.querySelectorAll('[role="button"]').forEach(el => el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
  if (ui.screen === 'title' || ui.screen === 'ending') app.insertAdjacentHTML('beforeend', CREDIT);
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
