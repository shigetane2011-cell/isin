<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>維新の乱流 ― 幕末、日本の夜明けを設計せよ ―</title>
<meta name="description" content="幕末を舞台にした歴史設計シミュレーション。151名の人物と対話し、言葉で5つの時勢を動かして日本の未来を決める。LLMを使わない完全決定論エンジン、ビルド不要、通信なし。">
<meta name="author" content="原案: ミッキーベルグ">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="維新の乱流 ― 幕末、日本の夜明けを設計せよ ―">
<meta property="og:description" content="人物の欲望・立場・論理を読み、ときに刃をかわしながら歴史を動かす幕末シミュレーション。同じseedと同じ選択なら盤面は必ず同じになる完全決定論エンジン。">
<meta property="og:url" content="https://shigetane2011-cell.github.io/isin/">
<meta property="og:image" content="https://shigetane2011-cell.github.io/isin/assets/hero-bakumatsu.webp">

<meta property="og:image:width" content="1600">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="幕末の城下と黒船を望み、それぞれの未来を見据える人々">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shigetane2011-cell.github.io/isin/assets/hero-bakumatsu.webp">
<link rel="preload" as="image" href="assets/hero-bakumatsu.webp" type="image/webp">
<style>
:root{
  --washi:#ece2cf; --washi2:#f6f0e1; --sumi:#1b1815; --sumi2:#3b342c;
  --shu:#b0272d; --ai:#22384e; --kin:#7d5c20; --line:#c9bca1;
  --kobu:#6f4a8e; --kaikoku:#2c6f9c; --sabaku:#3f704d; --yuhan:#8d5f17; --kosen:#a73732;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--washi);
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.55),transparent 60%),
                   radial-gradient(circle at 80% 80%,rgba(168,133,58,.10),transparent 55%);
  color:var(--sumi);
  font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header{border-bottom:3px double var(--sumi);padding-bottom:10px;margin-bottom:18px}
h1{font-size:1.6rem;margin:0;letter-spacing:.16em}
h1 .sub{display:block;font-size:.72rem;letter-spacing:.3em;color:var(--sumi2);margin-top:6px;font-weight:400}
.title-hero{
  position:relative;min-height:310px;margin:0 0 18px;overflow:hidden;
  border:1px solid var(--line);background-color:var(--washi2);
  background-image:linear-gradient(180deg,rgba(246,240,225,.08) 0%,rgba(236,226,207,0) 58%,rgba(236,226,207,.55) 100%),
                   url("assets/hero-bakumatsu.webp");
  background-position:center;background-size:cover;background-repeat:no-repeat;
  box-shadow:0 2px 8px rgba(27,24,21,.12)
}
.title-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 34px rgba(59,52,44,.12)
}
.title-hero .hero-copy{
  position:absolute;z-index:1;top:24px;left:20px;right:20px;text-align:center;
  color:var(--sumi);text-shadow:0 1px 0 rgba(255,253,247,.9),0 0 10px rgba(255,253,247,.75)
}
.title-hero h1{font-size:2.2rem;letter-spacing:.2em}
.title-hero h1 .sub{font-size:.78rem;letter-spacing:.34em;color:var(--sumi2);margin-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--sumi2);margin-top:10px}
.meta b{font-weight:600;color:var(--sumi)}
.player-premise{margin:2px 0 12px;padding:10px 13px;border:1px solid var(--line);border-left:5px solid var(--sumi2);
  background:linear-gradient(100deg,rgba(59,52,44,.10),rgba(246,240,225,.76));font-size:.9rem}
.player-premise .role{display:block;font-size:.7rem;letter-spacing:.18em;color:var(--sumi2);margin-bottom:2px}
.standing-change{position:relative;margin:12px 0 4px;padding:10px 13px 11px;border:1px solid rgba(var(--tone-a,59,52,44),.42);
  border-left:5px solid rgb(var(--tone-a,59,52,44));background:linear-gradient(100deg,rgba(var(--tone-a,59,52,44),.13),
  rgba(var(--tone-b,59,52,44),.06) 64%,rgba(255,253,247,.86))}
.standing-change .lbl{font-size:.68rem;letter-spacing:.18em;color:var(--sumi2)}
.standing-change .name{font-size:1rem;font-weight:700;letter-spacing:.05em;margin:2px 0}
.standing-change .before{font-weight:400;color:var(--sumi2)}
.standing-change .arrow{display:inline-block;margin:0 7px;color:rgb(var(--tone-a,59,52,44));font-weight:700}
.standing-change .ledger{margin-top:5px;font-size:.72rem;color:var(--sumi2)}
.final-standing{margin:8px 0 12px;padding:11px 14px;border-left:5px solid rgb(var(--tone-a,59,52,44));
  background:linear-gradient(100deg,rgba(var(--tone-a,59,52,44),.14),rgba(var(--tone-b,59,52,44),.06),transparent)}
.final-standing .name{font-size:1.08rem;font-weight:700;letter-spacing:.08em}
.panel{background:var(--washi2);border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin:14px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.05)}
.panel h2{font-size:.9rem;margin:0 0 10px;letter-spacing:.18em;color:var(--sumi2);
  border-left:4px solid var(--kin);padding-left:8px}
.panel.tone-panel{position:relative;border-color:rgba(var(--tone-a,59,52,44),.46);
  background:linear-gradient(108deg,rgba(var(--tone-a,59,52,44),.11),rgba(var(--tone-b,59,52,44),.055) 54%,rgba(246,240,225,.94) 84%),var(--washi2);
  box-shadow:inset 0 0 0 1px rgba(255,253,247,.72),0 2px 7px rgba(27,24,21,.09)}
.panel.tone-panel>h2:first-child{margin:-14px -16px 12px;padding:9px 14px 8px 17px;border-left:0;
  border-bottom:1px solid rgba(var(--tone-a,59,52,44),.28);color:var(--sumi);
  background:linear-gradient(90deg,rgba(var(--tone-a,59,52,44),.23),rgba(var(--tone-b,59,52,44),.11) 64%,rgba(246,240,225,.24))}
.panel.tone-panel>h2:first-child::before{content:"";display:inline-block;width:5px;height:1.05em;margin-right:9px;
  vertical-align:-.14em;background:linear-gradient(180deg,rgb(var(--tone-a,59,52,44)),rgb(var(--tone-b,59,52,44)));
  box-shadow:0 0 0 1px rgba(27,24,21,.15)}
.panel.tone-panel .quote{border-left-color:rgb(var(--tone-a,59,52,44));
  background:linear-gradient(90deg,rgba(var(--tone-a,59,52,44),.09),rgba(var(--tone-b,59,52,44),.035) 72%,transparent);
  padding:7px 10px}
.panel.tone-panel button.primary{color:#fff;border-color:rgb(var(--tone-a,59,52,44));
  background:linear-gradient(rgba(27,24,21,.16),rgba(27,24,21,.16)),rgb(var(--tone-a,59,52,44));
  box-shadow:inset 0 1px 0 rgba(255,253,247,.2)}
.panel.tone-panel button.primary:hover:not(:disabled){
  background:linear-gradient(rgba(27,24,21,.3),rgba(27,24,21,.3)),rgb(var(--tone-a,59,52,44))}
pre.chart{font-family:"SFMono-Regular",Consolas,"Noto Sans Mono CJK JP",monospace;
  font-size:.82rem;line-height:1.55;margin:0;white-space:pre;overflow-x:auto;color:var(--sumi)}
pre.chart .u{color:var(--shu);font-weight:700}
.route-guide{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.route-card{position:relative;overflow:hidden;padding:9px 11px;border:1px solid var(--line);border-left:4px solid var(--sumi2);
  background:#fff;font-size:.79rem;line-height:1.55}
.route-card.combo{border-left-color:rgb(var(--route-a));
  background:linear-gradient(102deg,rgba(var(--route-a),.11),rgba(var(--route-b),.07) 62%,#fff)}
.route-card .kind{font-size:.68rem;letter-spacing:.1em;color:var(--sumi2)}
.route-card .name{font-weight:700;letter-spacing:.04em}
.route-card .need{float:right;font-weight:700;color:var(--shu)}
.route-card.reached .need{color:var(--sabaku)}
.route-card .rule{display:block;color:var(--sumi2);font-size:.72rem;margin-top:2px}
.chart-panel.compact{padding-top:11px;padding-bottom:10px}
.chart-panel.compact h2{margin-bottom:6px}
.chart-glance{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-bottom:7px;
  color:var(--sumi2);font-size:.75rem}
.chart-glance .heat{font-weight:700;color:var(--shu);margin-right:2px}
.chart-glance .score{white-space:nowrap;font-weight:600}
.chart-panel.compact .route-guide{margin-top:6px}
.chart-panel.compact .route-card{padding-top:7px;padding-bottom:7px}
.chart-more{margin-top:7px}
.chart-more>summary{font-weight:600}
.chart-more .chart{margin-top:7px}
.chart-ledger{margin-top:7px;padding-top:7px;border-top:1px dotted var(--line)}
.f-kobu{color:var(--kobu)}.f-kaikoku{color:var(--kaikoku)}.f-sabaku{color:var(--sabaku)}
.f-yuhan{color:var(--yuhan)}.f-kosen{color:var(--kosen)}
.faction-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 4px;font-size:.78rem}
.faction-legend span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.faction-legend i,.visual-key i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:currentColor;
  box-shadow:0 0 0 1px rgba(27,24,21,.24)}
.person{border:1px solid var(--line);border-left:5px solid rgba(var(--tone-a,59,52,44),.72);
  background:linear-gradient(100deg,rgba(var(--tone-a,59,52,44),.11),rgba(var(--tone-b,59,52,44),.04) 48%,var(--washi2) 82%);
  padding:12px 14px;margin:10px 0;border-radius:2px;
  cursor:pointer;transition:.12s;position:relative}
.person:hover{border-color:var(--sumi);transform:translateX(2px)}
.person:focus-visible,.card:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.detail{margin-top:10px;font-size:.8rem;color:var(--sumi2)}
.detail summary{cursor:pointer;letter-spacing:.08em;opacity:.7}
.detail summary:hover{opacity:1}
.yowa summary{color:var(--kin);opacity:.85}
a.spot{color:var(--ai);text-decoration:none;border-bottom:1px dotted var(--ai)}
a.spot:hover{background:var(--ai);color:var(--washi2);border-bottom-color:transparent}
.opening{font-size:1.02rem;margin:2px 0 10px;color:var(--sumi);letter-spacing:.02em}
.duel{border:2px solid var(--shu);
  background:linear-gradient(105deg,rgba(var(--tone-a,176,39,45),.10),#fffaf8 48%,rgba(var(--tone-b,176,39,45),.08))}
.duel .title{font-size:1.3rem;letter-spacing:.1em;text-align:center;margin:6px 0 14px;color:var(--shu)}
.duelresult{border:2px solid var(--shu);padding:10px 14px;margin:10px 0;background:#fff}
.duelresult.won{border-color:var(--yuhan)}
.interlude{border:2px solid var(--sumi);
  background:linear-gradient(105deg,rgba(var(--tone-a,59,52,44),.12),#fffdf7 48%,rgba(var(--tone-b,59,52,44),.10))}
.interlude .title{font-size:1.4rem;letter-spacing:.14em;text-align:center;margin:6px 0 14px}
.interlude-figure{display:flex;gap:13px;align-items:center;margin:10px 0 13px;padding:9px 12px;
  border:1px solid rgba(var(--tone-a,59,52,44),.42);border-left:5px solid rgb(var(--tone-a,59,52,44));
  background:linear-gradient(100deg,rgba(var(--tone-a,59,52,44),.13),rgba(var(--tone-b,59,52,44),.07) 64%,rgba(255,253,247,.9))}
.interlude-figure .portrait{flex:0 0 66px;height:82px;padding:3px;
  background:linear-gradient(180deg,rgb(var(--tone-a,59,52,44)),rgb(var(--tone-b,59,52,44)));
  box-shadow:0 0 0 1px rgba(27,24,21,.45)}
.interlude-figure .portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 18%;
  border:1px solid rgba(255,253,247,.72)}
.interlude-figure .who{font-weight:700;letter-spacing:.08em}
.interlude-figure .role{font-size:.68rem;color:var(--sumi2);letter-spacing:.12em;margin-bottom:3px}
.interlude-figure .line{font-size:.86rem;line-height:1.65;margin-top:3px}
button.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;font-size:.92rem}
button .small{color:inherit;opacity:.85}
button:disabled{opacity:.45}
button.choice:disabled{background:var(--washi2);color:var(--sumi2)}
button.choice.hit-him{border-color:var(--kin);box-shadow:inset 0 0 0 1px var(--kin)}
button.choice.hit-here{border-color:var(--kin)}
.fate{border-left:3px solid var(--line);padding:8px 12px;margin:8px 0;font-size:.9rem}
.fate.won{border-left-color:var(--yuhan)}
.fate.lost{border-left-color:var(--sumi2);opacity:.85}
.tutorial-offer,.coach{border:1px solid rgba(177,123,36,.62);background:linear-gradient(105deg,rgba(177,123,36,.12),#fffdf7 72%);
  padding:12px 14px;margin:12px 0;font-size:.86rem;box-shadow:inset 4px 0 0 rgba(177,123,36,.5)}
.tutorial-offer .title,.coach .title{font-weight:700;letter-spacing:.1em;color:#7c551c}
.coach .step{display:inline-block;margin-right:7px;padding:1px 7px;border:1px solid currentColor;border-radius:9px;
  color:#7c551c;font-size:.7rem;font-weight:700;letter-spacing:.08em}
.coach p{margin:5px 0 0}
.card.guide-answer{border:2px solid var(--kin);background:linear-gradient(100deg,rgba(177,123,36,.13),#fffdf7 68%)}
.card.guide-decoy{opacity:.48;cursor:not-allowed}
.card.guide-decoy:hover{border-color:var(--line)}
.card.ruled-out{opacity:.5;cursor:not-allowed;background:rgba(59,52,44,.07);border-style:dashed}
.card.ruled-out:hover{border-color:var(--line)}
.card.ruled-out .mv{text-decoration:line-through;text-decoration-thickness:1px}
.card .ruled-mark{display:block;color:var(--shu);font-weight:700;font-size:.76rem;margin-bottom:3px}
.guide-reason{margin-top:6px;padding-top:6px;border-top:1px dotted rgba(177,123,36,.55);color:var(--sumi2);font-size:.76rem;line-height:1.65}
.guide-reason b{color:#7c551c}
.person .nm{font-size:1.05rem;font-weight:600;letter-spacing:.06em}
.person .tag{font-size:.72rem;border:1px solid currentColor;padding:1px 6px;margin-left:8px;vertical-align:2px;border-radius:2px}
.person .nick{font-size:.82rem;color:var(--sumi2);margin-top:2px}
.person .desc{font-size:.86rem;margin-top:8px;padding-left:10px;border-left:2px solid var(--line);color:var(--sumi2)}
.person.has-portrait{min-height:114px;padding-left:102px}
.person-thumb{position:absolute;left:12px;top:12px;width:72px;height:90px;padding:3px;
  background:linear-gradient(180deg,rgb(var(--tone-a,59,52,44)),rgb(var(--tone-b,59,52,44)));
  box-shadow:0 0 0 1px rgba(27,24,21,.5),0 3px 8px rgba(27,24,21,.18)}
.person-thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 18%;
  border:1px solid rgba(255,253,247,.72);background:var(--washi)}
.person.intro{border-left:4px solid var(--kin)}
.person.revisit{border-left:4px solid var(--shu)}
/* 働きかけの早見表。人物ごとの情報ではなく、規則そのものを読めるようにする */
.legend{margin:8px 0 4px;padding:9px 12px;background:var(--washi);border:1px solid var(--line);
  border-radius:2px;font-size:.84rem}
.legend>summary{cursor:pointer;color:var(--sumi2)}
.legend>div{margin-top:4px}
.legend .hit{color:var(--kin);font-weight:600}
.legend .small{margin-top:7px;opacity:.75}
.opening.sit{color:var(--sumi2);font-size:.95rem;margin:-6px 0 10px}
.pre{font-size:.86rem;color:var(--sumi2);margin:6px 0 2px;letter-spacing:.02em}
/* 人物の絵。勢力の情景は横長の帯だが、本人の絵は縦長で中央に置く */
.story-visual.portrait-visual .visual-images{max-width:340px;margin:0 auto}
.story-visual.portrait-visual img{aspect-ratio:3/4;object-fit:cover}
.say.worldview{border-left-color:var(--sumi2);opacity:.9}
.detail.savefold{margin-top:14px}
/* 行き先の選択列。別画面をやめて面会候補と同じ画面に載せる */
.placebar{margin-bottom:10px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.placechip{font-size:.85rem;padding:6px 11px;text-align:left;line-height:1.35}
.placechip .nm{font-weight:600}
.placechip .small{display:block;opacity:.85;font-size:.72rem;margin-top:1px}
.placechip .travel{display:block;color:var(--shu);font-size:.68rem;font-weight:700;margin-top:2px}
.placechip.on{background:var(--sumi);color:var(--washi2);border-color:var(--sumi);
  box-shadow:inset 0 0 0 2px rgba(255,253,247,.48)}
.placechip.on .nm::before{content:'✓ ';color:#fff}
.placechip.on .small span{color:var(--washi2)}
.placechip.on .travel{color:#ffd9cc}
.placebar .locked{margin-top:6px;opacity:.5}
.card .mv{color:var(--sumi2);font-weight:600;margin-right:2px}
.card.sel .mv,.card.ans .mv{color:inherit}
.person.place{border-left:4px solid var(--sumi2);position:relative;overflow:hidden}
.person.place::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--pf-a,var(--sumi2)),var(--pf-b,var(--sumi2)))}
.uibadge{color:var(--kin);font-weight:600}
/* 縁。人脈の誰かが顔になっている相手と、決裂の噂が先に届いている相手 */
.tie{margin-top:8px;padding:7px 11px;border-left:3px solid var(--kin);
  background:rgba(160,120,40,.08);font-size:.85rem;border-radius:2px}
.tie.bad{border-left-color:var(--shu);background:rgba(176,58,46,.06)}
.tie .who{font-weight:600;letter-spacing:.04em}
.tie .small{display:block;margin-top:4px;color:var(--sumi2)}
/* 約束。腹を割って明かした旗は、終局まで持ち越される */
.pill.vow{border-color:var(--kin)}
.tag.vow{color:var(--kin);border-color:var(--kin)}
.fate .tag{font-size:.72rem;border:1px solid currentColor;padding:1px 6px;margin:0 4px 0 8px;
  vertical-align:1px;border-radius:2px}
.vowline{margin-top:8px;padding:7px 11px;border-left:3px solid var(--kin);
  background:rgba(160,120,40,.08);font-size:.84rem;border-radius:2px}
/* 現在地の帯。行き先の札と同じ配色の筋を引き、いま居る場を面会画面にも残す */
.here{position:relative;overflow:hidden;background:var(--washi);border:1px solid var(--line);
  border-left:4px solid var(--sumi2);border-radius:2px;padding:9px 12px 10px 13px;margin:0 0 12px}
.here::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--pf-a,var(--sumi2)),var(--pf-b,var(--sumi2)))}
.here .lbl{font-size:.72rem;letter-spacing:.18em;color:var(--sumi2);margin-right:10px}
.here .nm{font-size:1rem;font-weight:600;letter-spacing:.06em}
.here .tag{font-size:.72rem;border:1px solid currentColor;padding:1px 6px;margin-left:8px;
  vertical-align:2px;border-radius:2px;color:var(--sumi2)}
.here .desc{font-size:.82rem;color:var(--sumi2);margin-top:5px}
.travel-note{margin-top:8px;padding:7px 10px;border-left:3px solid var(--shu);background:rgba(176,58,46,.07);
  color:var(--sumi);font-size:.78rem;line-height:1.6}
.travel-note.safe{border-left-color:var(--sabaku);background:rgba(63,112,77,.07)}
.here .row{margin-top:8px}
.here button{padding:6px 12px;font-size:.84rem}
.warn{color:var(--shu);font-size:.78rem;margin-top:6px}
button{font-family:inherit;font-size:.9rem;background:var(--washi2);border:1px solid var(--sumi2);color:var(--sumi);
  padding:8px 16px;border-radius:2px;cursor:pointer;letter-spacing:.08em}
button:hover:not(:disabled){background:var(--sumi);color:var(--washi2)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--ai);border-color:var(--ai);color:#fff}
button.primary:hover:not(:disabled){background:#162a3c}
button.primary .small{color:inherit;opacity:.82}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.card{border:1px solid var(--line);background:var(--washi2);padding:10px 12px;margin:7px 0;cursor:pointer;
  font-size:.88rem;border-radius:2px;transition:.1s}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:7px}
.card-grid .card{height:100%;margin:0;line-height:1.6}
.approach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}

<script type="module">
/* ==ENGINE START== */
/* ============================================================================
   維新の乱流 ― 決定論エンジン
   ・乱数は seed 付き mulberry32 のみ。Math.random / Date.now は一切使用しない。
   ・seed + 選択列 だけが状態を決める。同じ入力なら常に同じ盤面になる。
   ========================================================================== */

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const chars = s => Array.from(s).length;

/* --- PRNG --------------------------------------------------------------- */
function mulberry32(a){
  a = a >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 呼び出し順に依存しないよう、用途ごとに独立した流れを作る */
function streamOf(seed, turn, salt){
  let h = (seed >>> 0) ^ Math.imul(turn + 1, 0x9E3779B1) ^ Math.imul(salt + 1, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35) >>> 0;
  return mulberry32(h);
}
function pickDistinct(rnd, pool, n){
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

/* --- 勢力 --------------------------------------------------------------- */
const FACTIONS = [
  { key:'kobu',    name:'公武', full:'公武合体', cls:'f-kobu' },
  { key:'kaikoku', name:'開国', full:'開国通商', cls:'f-kaikoku' },
  { key:'sabaku',  name:'佐幕', full:'佐幕守旧', cls:'f-sabaku' },
  { key:'yuhan',   name:'雄藩', full:'雄藩連合', cls:'f-yuhan' },
  { key:'kosen',   name:'抗戦', full:'尊皇攘夷', cls:'f-kosen' },
];
/* 対立軸。史実で真っ向からぶつかった組み合わせを敵対関係として持つ。
   自分の盤面で相手の対立勢力が WARY_LINE 以上まで育っていると、
   その人物は端から警戒し、交渉の判定が一段下がる。
   「寄せすぎると誰も話を聞いてくれなくなる」という圧力を作るための規則。 */
const OPPOSED = [
  [4, 1, 3], // 公武 ↔ 抗戦（融和と過激攘夷）/ 開国（攘夷志向の朝廷）/ 雄藩（倒幕へ傾く大藩）
  [4, 0],    // 開国 ↔ 抗戦（開国か攘夷か）/ 公武
  [3, 4],    // 佐幕 ↔ 雄藩（幕府か倒幕か）/ 抗戦（新選組と志士）
  [2, 0],    // 雄藩 ↔ 佐幕 / 公武
  [2, 1, 0], // 抗戦 ↔ 佐幕 / 開国 / 公武
];
const WARY_LINE = 12;
/* --- 混沌 -----------------------------------------------------------------
   失敗の回数で溜める案を先に測ったが、決裂 0.43〜1.23人/局・立ち合い敗北 0.26〜0.47回/局
   しか焚かれず、勝率は 8%→6% とほとんど動かなかった。しかも溜まるのは負けている側だけで、
   強い打ち手には何も起きない ―― 差を広げるだけの仕組みになる。

   そこで燃料を「失敗」ではなく「荒っぽさ」に変えた。論破を仕掛ければ、勝っても荒れる。
   効き方も獲得減ではなく警戒線を下げる形にした。獲得が削られても手触りが残らないが、
   「会ってくれる人が減る」は盤面が変わるので体で分かる。そして警戒は人脈の縁があれば
   通らない（既存規則）ので、荒らした分は人脈で買い戻せる ―― 詰みにならない。 */
const CHAOS_STEP = 3;     /* これだけ溜まるごとに警戒線が1下がる */
const WARY_FLOOR = 6;     /* いくら荒れてもここまで */
const waryLineOf = chaos => Math.max(WARY_FLOOR, WARY_LINE - Math.floor((chaos || 0) / CHAOS_STEP));
/* 何が世を荒らすか。仕掛けた時点で焚かれるので、成否は問わない。 */
const CHAOS_CAUSES = [
  { key:'convert', d:1, text:'論破を仕掛けた' },
  { key:'hot',     d:1, text:'荒事の場で会った' },
  { key:'misfit',  d:1, text:'読み違えた賭けに出た' },
  { key:'banned',  d:2, text:'決裂させた' },
  { key:'duelLost',d:2, text:'刃に敗れた' },
];

const ERAS  = ['初級期','中級期','上級期','伝説期'];
const RANKS = ['初級','中級','上級','伝説'];
const MAX_ID_BY_ERA = [30, 90, 135, 151];
const rankOfId = id => id <= 30 ? 0 : id <= 90 ? 1 : id <= 135 ? 2 : 3;
const eraOfTotal = t => t < 10 ? 0 : t < 25 ? 1 : t < 40 ? 2 : 3;

/* --- 論証カード ----------------------------------------------------------
   カテゴリ: 0=利益提示 / 1=文脈理解 / 2=論理整合
   動機型(索引 0..5) は全勢力で共通。人物ごとの「刺さる型」は不変で、
   どの思想の言葉で語るか(勢力)だけが立場によって変わる。
   ------------------------------------------------------------------------ */
const CATS = [
  { name:'利益提示', hint:'この人物が欲しているものは何か',

/* 相手の立場。誰に向かって話すかで、持ち出す例が変わる。
   公家と、家格の高い武家は「上」。町人・女・異人は「下と外」。残りが「中」。 */
function listenerGroup(charId){
  const v = voiceOf(charId), r = rankOfId(charId);
  if (v === 2 || (v === 1 && r >= 2)) return 0;
  if (v === 3 || v === 4 || v === 6) return 2;
  return 1;
}

/* 通常の問いで否定される型。正解以外の5つから seed・ターン・人物・カテゴリで
   一つを決める。同じ局面では必ず同じ返答になり、カード三択にも必ず混ぜる。 */
const DENIAL_BASES = [
  ['名誉や武名が目当てではない','銭や利権が目当てではない','身の安全だけが望みではない',
   '大義や理念のためではない','力や武備を求めているのではない','知識や学問を求めているのではない'],
  ['家門や血筋に縛られているのではない','主君への義理に縛られているのではない',
   '民草の暮らしに縛られているのではない','列強の圧力に縛られているのではない',
   '同志の死に縛られているのではない','出自の低さに縛られているのではない'],
  ['目的と手段だけを筋と見ているのではない','段取りや順序だけを筋と見ているのではない',
   '力の均衡だけを筋と見ているのではない','名分だけを筋と見ているのではない',
   '目先の実利だけを筋と見ているのではない','時勢や必然だけを筋と見ているのではない'],
];
const DENIAL_ENDS = [
  '。そこを読み違えるな。',
  '。少なくとも、そこは違い申す。',
  'のう。そこを取り違えてはならぬ。',
  'んですよ。そこは見当違いでさ。',
  'のです。そこだけは違います。',
  '。少なくとも、その見立ては外れている。',
  '。その考えは除いてください。',
];
function deniedMotiveOf(st, charId, cat){
  const correct = CHAR_BY_ID.get(charId).correct[cat];
  const wrong = [0,1,2,3,4,5].filter(m => m !== correct);
  const rnd = streamOf(st.seed, st.turn, 810007 + charId * 17 + cat * 101);
  return wrong[Math.floor(rnd() * wrong.length)];
}
function denialOf(st, charId, cat){
  const denied = deniedMotiveOf(st, charId, cat);
  return DENIAL_BASES[cat][denied] + DENIAL_ENDS[voiceOf(charId)];
}

     人物の語り口で決まるので、同じ相手はいつも同じ迎え方をする ―― それが人物像になる。 */
  parlor:   ['scene','tie','recv','open','world','sit','chips'],
  formal:   ['scene','tie','open','recv','sit','chips'],
  plain:    ['scene','tie','open','recv','sit','world','chips'],
};
const SCENE_KEYS = Object.keys(SCENE_ORDER);
function sceneOf(st, charId, place){
  if ((st.banned || []).includes(charId)) return 'revisit';
  if (HOTHEADS.has(charId) && place != null && PLACES[place].hot) return 'blade';
  if (vouchOf(st, charId) >= 0) return 'escort';
  if (rankOfId(charId) >= 2 || waryOf(st.currents, charId, st.chaos) >= 0) return 'challenge';
  if (st.turn >= MAX_TURN - 1) return 'haste';
  const v = voiceOf(charId);
  if (v === 3 || v === 4) return 'parlor';      /* 町人・商人／女 */
  if (v === 1 || v === 2) return 'formal';      /* 武家・幕臣／公家・宮中 */
  return 'plain';                               /* 志士・学者・異人 */
}

function sceneSayOf(st, charId, place){
  const key = sceneOf(st, charId, place), pool = SCENE_SAYS[key];
  return pool[Math.floor(streamOf(st.seed, st.turn, 909 + charId)() * pool.length)];
}

/* --- 場 -------------------------------------------------------------------

   使える働きかけが変わり、その場に合った当たり方は深く刺さる。
   「誰と会うか」の前に「どこへ行くか」という別種の判断を挟むための仕掛け。
   ------------------------------------------------------------------------ */

  { name:'祇園の茶屋', where:'京',
    desc:'三味線の音が障子越しに漏れてくる。ここでは誰もが少し口が軽くなる。',
    favor:[0,4], allow:[0,1,3], boost:1 },
  { name:'江戸城中', where:'江戸',
    desc:'畳の目まで格式が決まっている。ここで酒を酌むことも、金を積むこともできない。',
    favor:[2,0], allow:[0], boost:0, minRank:1, unlockEra:1 },
  { name:'長崎の商館', where:'長崎',
    desc:'硝子窓の向こうに帆柱が並ぶ。ここでは値のつかぬ話に意味はない。',
    favor:[1], allow:[0,2,3], boost:2 },
  { name:'藩邸の書院', where:'京',
    desc:'国元の訛りが飛び交っている。腹の内を見せぬ者は、ここでは相手にされない。',
    favor:[3,2], allow:[0,3], boost:3 },
  { name:'壬生の屯所', where:'京',
    desc:'稽古の音と血の匂いが同居している。気の短い者ばかりだ。',
    favor:[2,0], allow:[0,1,3], boost:3, hot:true },
  { name:'夜の街道', where:'街道',
    desc:'提灯ひとつの闇。名も知れぬ者と、名を捨てた者が行き交う。',
    favor:[4,3], allow:[0,1,3], boost:1, hot:true },
];
const placeAllows = (pl, ap) => PLACES[pl].allow.includes(ap);
/* その時代に行ける場だけを返す */
const placesOpen = st => PLACES.map((p, i) => i)
  .filter(i => (PLACES[i].unlockEra ?? 0) <= eraOf(st) && i !== st.lastPlace);
/* 京・江戸・長崎を一息に移ると、その日は旅だけで半ば潰れる。
   新しい体力ゲージは持たず、面会の選択肢が1名減ることで距離を表す。
   街道は中継地なので、街道を挟めば旅疲れは起きない。 */
const CITY_AREAS = new Set(['京','江戸','長崎']);
function travelFatigue(lastPlace, nextPlace){
  if (lastPlace == null || nextPlace == null) return false;
  const from = PLACES[lastPlace]?.where, to = PLACES[nextPlace]?.where;
  return from !== to && CITY_AREAS.has(from) && CITY_AREAS.has(to);
}
/* 場ごとの面会人数。荒事の場は人の出入りが多く、格式のある場は通される相手が限られる。
   短気な者の枠は常に1つなので、人数が増えるほどその偏りは薄まる ―― 短気な25名は
   佐幕36%・抗戦56%・公武4%・雄藩4%・開国0% で、名簿の均等（各20%）を壊していた。
   合計は 3+2+3+2+4+4=18 で、全場3名だった頃（6×3=18）と変えていない。 */
const PLACE_SEATS = [3, 2, 3, 2, 4, 4];
const normalMeetingCount = (st, place) => Math.max(2,
  (place == null ? 3 : PLACE_SEATS[place]) - (travelFatigue(st.lastPlace, place) ? 1 : 0));

/* --- 働きかけ -------------------------------------------------------------
   同じ「3枚当てる」を10ターン繰り返すと単調になる。そこで、相手への
   当たり方そのものを選べるようにした。4通りで**決定の形が違う**のが肝で、
   カードを3枚組む／2枚だけ／1枚に賭ける／引かない、と手触りが変わる。

   響く働きかけは「利益の型」からほぼ導ける（＝対話や奥の手で既に学んでいる
   知識がそのまま効く）。そのうえで、型から外れる人物を手で指定してある。
   ------------------------------------------------------------------------ */

const APPROACH_EXCEPTION = new Map([
  [2,1],[13,1],[19,1],[26,2],[29,2],[49,1],[51,1],[59,1],[65,1],[80,1],[87,1],[89,1],

  [138,2],[140,0],[144,3],[145,3],[147,0],[148,0],[149,1],[150,3],

const approachOf = id => APPROACH_EXCEPTION.has(id)
  ? APPROACH_EXCEPTION.get(id)
  : APPROACH_BY_MOTIVE[CHAR_BY_ID.get(id).correct[0]];

const canConvert = ap => APPROACHES[ap].cap === 3;

const promiseFate = (f, kept, n) => { const a = PROMISE_FATES[f][kept ? 0 : 1];
  return a[((n || 0) % a.length + a.length) % a.length]; };

/* エンディングで採られた勢力の集合 */
function winningFactions(ending){
  if (ending.kind === 'solo') return [ending.faction];
  if (ending.kind === 'combo') return ending.pair.slice();
  return [];
}
/* 果たした約束と、違えた約束 */
function promiseReport(st, ending){
  const winners = winningFactions(ending), kept = [], broken = [];
  for (const p of (st.promises || [])) (winners.includes(p.f) ? kept : broken).push(p);
  return { kept, broken };
}
/* n を渡すと、ひな型の言い回しをずらせる。
   同じ勢力の無名の人物が並んだとき、同じ文が続かないようにするため。 */
function fateOf(charId, winners, n){
  const ch = CHAR_BY_ID.get(charId);
  const won = ch.factions.some(f => winners.includes(f));
  const named = FATES.get(charId);
  if (named) return { won, text: named[won ? 0 : 1] };
  const a = FATE_TEMPLATE[ch.factions[0]][won ? 0 : 1];
  return { won, text: a[((n || 0) % a.length + a.length) % a.length] };
}

     61 板垣退助    武力討幕論者。兵の数と勢いでしか物事を測らない
     84 前原一誠    曲がったことを憎む（史実でも萩の乱で挙兵している）
    127 山県有朋    奇兵隊の軍監。身分の低さを軍功で覆そうとする
   開国は0のままにした。名簿の開国32名は商人・学者・外交官・通詞で、
   刀に手をかける人物像が一人もいない ―― 数合わせで足すと人物像のほうが壊れる。 */
const HOTHEADS = new Set([13,14,21,22,28,29,47,48,49,51,61,63,65,67,68,70,79,80,82,84,87,88,89,90,113,127,131,133,135]);

/* 利益の型 → 通じる応じ方。名誉と武は力に、大義と学は言葉に、金と保身は間合いに応じる。 */
const DUEL_ANSWER = [0, 2, 2, 1, 0, 1];
/* 立ち合いが起きる条件: 短気な相手に、説得が通らなかったとき。
   支持でも起きる ―― 見え透いた世辞は、この手の男をかえって怒らせる。 */
function duelPending(st, action){
  if (!HOTHEADS.has(action.charId)) return false;
  if ((action.approach ?? 0) === 1) return false;   // 杯を交わした相手は刀を抜かない
  /* 転向は「攻撃」。この手の男に仕掛ければ、通ろうと通るまいと刃が出る。
     支持なら、見え透いた世辞と受け取られたときだけ怒らせる。 */
  return action.stance === 'convert' || scoreOf(st, action) < 2;
}

/* --- 状態 ---------------------------------------------------------------- */
const MAX_TURN = 10, GOAL = 30, COMBO_GOAL = 28, CAP = 40, COMBO_MIN = 10;
/* 「さらに聞き出す」と3つの正解がすべて分かるが、手の内を明かした分だけ影響力が落ち、
   その交渉の獲得が1下がる。これは一局に一度だけの奥の手。
   何度も使える通常手順ではなく、誰に切るかを決める選択にする。 */
const PROBE_LIMIT = 1;
/* 幕間「政変」が起きるターン。この時点の上位2勢力の組合せで事件が決まる。 */
const INTERLUDE_TURNS = [5, 8];
const INTERLUDE_SETS = [INTERLUDES_EARLY, INTERLUDES];
const INTERLUDE_TURN = INTERLUDE_TURNS[INTERLUDE_TURNS.length - 1];   // 表示・互換のため
/* 幕間を「事件の説明」だけで終わらせず、その流れを象徴する人物の顔を置く。
   前編・後編で一人ずつ。全員、史料を参照した肖像を持つ主要人物に限る。 */
const INTERLUDE_FIGURES = {
  '0+1':[33,95],  '0+2':[33,140], '0+3':[33,103], '0+4':[33,144],
  '1+2':[95,140], '1+3':[145,103],'1+4':[95,144], '2+3':[140,103],
  '2+4':[47,144], '3+4':[142,144],
};

function createState(seed, origin){
  return { seed: seed >>> 0, origin: clamp(Number.isInteger(origin) ? origin : 0, 0, ORIGINS.length - 1),
           turn: 1, currents:[0,0,0,0,0],
           contacts:[], banned:[], promises:[], interludes:[], lastLen:0, probesUsed:0, interlude:null, lastPlace:null, chaos:0,
           actions:[], finished:false };
}
const totalOf = st => st.currents.reduce((a,b)=>a+b,0);
const eraOf   = st => eraOfTotal(totalOf(st));

/* 主人公には新しい能力値を持たせない。すでに盤面にある時勢・人脈・約束・決裂から、
   周囲にどう見られているかを導く。国の結末だけでなく、行動によって「自分が何者に
   なったか」を毎手返すための、純粋な派生状態である。 */
function playerStanding(st){
  const cur = (st.currents || [0,0,0,0,0]).slice();
  const contactIds = st.contacts || [];
  const contacts = contactIds.length;
  const promises = (st.promises || []).length;
  const enemies = (st.banned || []).length;
  const acted = (st.actions || []).length;
  const total = cur.reduce((sum, v) => sum + v, 0);
  const order = [0,1,2,3,4].sort((a,b) => cur[b] - cur[a] || a - b);
  const a = order[0], b = order[1], av = cur[a], bv = cur[b];
  const alignedContacts = contactIds.filter(id => CHAR_BY_ID.get(id)?.factions.includes(a)).length;
  const origin = ORIGINS[st.origin ?? 0] || ORIGINS[0];
  const base = { contacts, promises, enemies, origin };

  if (!acted && total === 0 && contacts === 0 && enemies === 0)
    return Object.assign(base, { key:'unseen', short:'無所属の周旋家',
      title:'どこにも属さない無名の周旋家', factions:[],
      text:'幕府にも朝廷にも、いずれの藩にも籍はない。まだ誰も、あなたの旗色も名も知らない。' });

  if (av === 0){
    if (contacts > 0)
      return Object.assign(base, { key:'unbound-known', short:'名を知られた無所属の周旋家',
        title:'旗を持たず、名だけを知られた周旋家', factions:[],
        text:'まだどの旗にも与していないが、あなたの名を引き受ける者はできた。' });
    return Object.assign(base, { key:'unbound-enmity', short:'敵を作った無所属の周旋家',
      title:'旗を持たず、敵だけを作った周旋家', factions:[],
      text:'どの陣営にも足場を築けないまま、拒まれたという噂だけが先に歩いている。' });
  }

  if (av >= GOAL)
    return Object.assign(base, { key:`flag-${a}`, short:`${FACTIONS[a].name}の旗頭`,
      title:`${FACTIONS[a].full}の旗頭`, factions:[a],
      text:`${FACTIONS[a].full}の勝利と、あなた自身の名を切り離せないところまで来た。味方にも敵にも、旗を掲げた者として知られている。` });

  const bridges = bv >= COMBO_MIN || (bv >= 3 && av - bv <= 5);
  if (bridges)
    return Object.assign(base, { key:`bridge-${[a,b].sort((x,y)=>x-y).join('-')}`,
      short:`${FACTIONS[a].name}×${FACTIONS[b].name}の仲介人`,
      title:`${FACTIONS[a].name}と${FACTIONS[b].name}をつなぐ仲介人`, factions:[a,b],
      text:`${FACTIONS[a].full}と${FACTIONS[b].full}、二つの陣営を往来する立場になった。どちらにも完全には属さないからこそ、通せる話がある。` });

  if (av >= WARY_LINE)
    return Object.assign(base, { key:`vanguard-${a}`, short:`${FACTIONS[a].name}派の急先鋒`,
      title:`${FACTIONS[a].full}の急先鋒`, factions:[a],
      text:`あなたの言葉は${FACTIONS[a].full}の旗と見分けがつかなくなった。味方は頼り、対立する者は会う前から警戒する。` });

  if (av >= 5 || alignedContacts >= 2)
    return Object.assign(base, { key:`connected-${a}`, short:`${FACTIONS[a].name}派の周旋家`,
      title:`${FACTIONS[a].name}派に顔の利く周旋家`, factions:[a],
      text:`${FACTIONS[a].full}の人物が、あなたの名を取り次ぐようになった。無名ではあるが、もはや無関係な者ではない。` });

  return Object.assign(base, { key:`lean-${a}`, short:`${FACTIONS[a].name}寄りの周旋家`,
    title:`${FACTIONS[a].name}寄りと見られ始めた周旋家`, factions:[a],
    text:`まだ旗を掲げたわけではない。それでも世間は、あなたが${FACTIONS[a].full}へ肩入れしていると見始めた。` });
}

function playerEpilogue(st, ending){
  const standing = playerStanding(st);
  const contacts = (st.contacts || []).slice().sort((a,b) => rankOfId(b) - rankOfId(a) || a - b);
  const promises = st.promises || [], enemies = st.banned || [];
  const turns = (st.actions || []).length;
  const notable = contacts.slice(0, 2).map(id => CHAR_BY_ID.get(id).name);
  const trail = contacts.length
    ? `${contacts.length}人があなたの名を通す。${notable.length ? `とりわけ${notable.join('と')}は、あなたが何者だったかを覚えている。` : ''}`
    : '最後まで、あなたの名を引き受ける人脈は築けなかった。';
  const burdens = promises.length || enemies.length
    ? `${promises.length ? `${promises.length}本の約束を背負い` : '約束は残さず'}、${
      enemies.length ? `${enemies.length}人との決裂を抱えて` : '決裂した相手もなく'}終局を迎えた。`
    : '約束も決裂も残さず、終局を迎えた。';
  const chaos = st.chaos ?? 0;
  const trail2 = chaos >= CHAOS_STEP * 4
    ? `あなたが通った跡には、${chaos}ぶんの荒れが残った。名を聞いただけで身構える者が、京にも江戸にもいる。`
    : chaos >= CHAOS_STEP * 2 ? `いくらかの荒れは残したが、道を塞ぐほどではなかった。`
    : `血を流さずここまで来た。それを覚えている者がいる。`;
  const consequence = (ending.kind === 'chaos'
    ? `世間はあなたを「${standing.title}」と呼んだが、その立場を公の役目へ変える政権は生まれなかった。`
    : `世間が呼ぶ「${standing.title}」という名のまま、新しい世の中へ入る。`) + trail2;
  return { title:standing.title, factions:standing.factions, origin:standing.origin,
    text:`${standing.origin.lead}${turns}度の面会を重ねた。${trail}${burdens}${consequence}` };
}

/* 基点ID: (直前の論証文の文字数 × ターン数) を名簿数で割った剰余。第1ターンのみ seed から。
   原作は100名なので「下2桁」＝ %100 だった。名簿を広げたため法だけを合わせてある。
   名簿数を素数151にしてあるのは意図的で、法が合成数だと gcd(ターン数, 法) の倍数しか
   基点にならない（例: 法150のターン10では10の倍数15通りしか出ない）。素数なら全域に散る。 */
const ROSTER = 151;
function baseId(st){
  if (st.turn === 1) return Math.floor(streamOf(st.seed, 0, 7)() * ROSTER) + 1;
  const v = (st.lastLen * st.turn) % ROSTER;
  return v === 0 ? ROSTER : v;
}

/* 面会リスト: 通常枠3名（遠路を直行した日は2名）＋ 紹介枠0..1名 */
/* 場の指定がある場合、通常枠のうち2枠までをその場に集まる勢力へ寄せる。
   基点IDの算出はそのままで、前方送りの条件に「場に合うか」を足すだけ。 */
function meetingList(st, place){
  const era = eraOf(st), maxId = MAX_ID_BY_ERA[era];
  const pl = place == null ? null : PLACES[place];
  const b = baseId(st);
  const taken = new Set(), normal = [];
  const free = id => !taken.has(id) && !st.contacts.includes(id) && !st.banned.includes(id);
  /* 枠の役目は 0=場の好み 1=出自の縁 2=荒事なら短気な者 3=自由。
     人数が少ない場でも 0 と 1 は残るので、場の性格と出自はどこでも効く。
     強く縛ると「毎ターン目当ての勢力を引ける」ようになるため、縛るのは前の枠だけ。 */
  const warm = new Set((ORIGINS[st.origin ?? 0] || ORIGINS[0]).warm);
  const suits = (id, slot) => {
    if (slot === 1 && !warm.has(voiceOf(id))) return false;   /* 出自の縁 */
    if (!pl) return true;
    if (pl.minRank != null && rankOfId(id) < pl.minRank) return false;
    if (slot === 0) return CHAR_BY_ID.get(id).factions.some(f => pl.favor.includes(f));
    if (slot === 2 && pl.hot) return HOTHEADS.has(id);
    return true;                                              /* 4枠目は自由 */
  };
  [b, b + 37, b + 73, b + 109].slice(0, normalMeetingCount(st, place)).forEach((raw, slot) => {
    const r = raw > ROSTER ? raw - ROSTER : raw;
    let id = rankOfId(r) > era ? (r % 30) + 1 : r;   // ランク補正（強制変換）
    /* 条件を満たす者を全部集めてから、基点IDで選ぶ。
       以前は基点から +1 ずつ前へ探して最初の一人で止めていたが、名簿が勢力ごとの
       連番（1-6公武 / 7-12開国 / 13-18佐幕 / 19-24雄藩 / 25-30抗戦）なので、
       「長い空白のあとに来るブロック」が候補を吸い込んでいた。祇園（公武・抗戦）なら
       基点が7〜24のとき必ず25番の抗戦に先に当たる ―― 抗戦80%対公武20%である。
       実測でも初級期の公武は10%、佐幕は29%まで偏っていた（名簿は各20%ちょうど）。 */
    const pool = [], any = [];
    for (let k = 1; k <= maxId; k++){
      if (!free(k)) continue;
      any.push(k);
      if (suits(k, slot)) pool.push(k);
    }
    const from = pool.length ? pool : any;          // 条件を満たす者がいなければ場を無視
    /* 基点は剰余ではなく比例で割り当てる。名簿30人・候補12人のような割り切れない
       組み合わせだと、剰余は先頭側に多く配ってしまう（祇園で公武61%対抗戦39%になった）。 */
    if (from.length) id = from[Math.floor((id - 1) * from.length / maxId)];
    taken.add(id); normal.push(id);
  });
  return { base: b, normal, intro: introPick(st, taken), revisit: revisitOf(st, place) };
}

/* 紹介枠: 人脈が空なら必ず null（原作の厳守事項）。
   優先順位は原作どおり ①未獲得 ②史実の結びつき ③より高ランク。
   ただし③を「絶対に最高ランク」とすると決定論ゆえ毎回同じ顔になるため、
   ランクを重み（初級1・中級4・上級9・伝説16）とした抽選にしてある。
   大物ほど来やすい性質は保ちつつ、局ごとに顔ぶれが変わる。 */
function introPick(st, exclude){
  if (!st.contacts.length) return null;
  const excl = new Set([...st.contacts, ...st.banned, ...(exclude || [])]);
  /* 決裂した人物の縁筋も閉じる。激怒した相手の周辺は、こちらに会おうとしない。 */
  for (const b of st.banned) for (const t of (TIE_GRAPH.get(b) || [])) excl.add(t);
  const tied = new Set();
  for (const c of st.contacts) for (const t of (TIE_GRAPH.get(c) || [])) if (!excl.has(t)) tied.add(t);
  let cands = [...tied].sort((a, b) => a - b);        // ②史実の結びつきを優先
  if (!cands.length){                                 // 縁が尽きたら同勢力の未獲得から
    const facs = new Set(st.contacts.flatMap(c => CHAR_BY_ID.get(c).factions));
    cands = CHARACTERS.filter(ch => !excl.has(ch.id) && ch.factions.some(f => facs.has(f))).map(ch => ch.id);
  }
  if (!cands.length) return null;
  const w = cands.map(id => (rankOfId(id) + 1) ** 2); // ③より高ランクを重みとして効かせる
  const rnd = streamOf(st.seed, st.turn, 4242);
  let r = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++){ r -= w[i]; if (r < 0) return cands[i]; }
  return cands[cands.length - 1];
}

/* 論証カードの提示（各カテゴリ3枚。正解1＋ダミー2、並びも決定論的） */
function cardOptions(st, charId, faction){
  const ch = CHAR_BY_ID.get(charId), out = [];
  for (let cat = 0; cat < 3; cat++){
    const correct = ch.correct[cat];
    /* 通常の問いで否定される一枚を必ずダミーに含める。これにより問いを使うと
       画面上でも三択から一枚が消え、残り二択になる。 */
    const denied = deniedMotiveOf(st, charId, cat);
    const rnd = streamOf(st.seed, st.turn, charId * 13 + faction * 7 + cat);
    const other = pickDistinct(rnd,
      [0,1,2,3,4,5].filter(m => m !== correct && m !== denied), 1)[0];
    const decoys = [denied, other];
    out.push(pickDistinct(rnd, [correct, ...decoys], 3)
      .map(m => ({ motive:m, text: CARDS[faction][cat][m][listenerGroup(charId)] })));
  }
  return out;
}

/* 論証文の組み立て。プレビューと判定で必ず同一の文字列になるよう1か所に集約する。
   ここで得られる文字数が、次ターンの基点IDを決める。 */
function composeArgument(argueF, cards, approach, pre, grp){
  const n = APPROACHES[approach ?? 0].cards;
  if (n === 0) return '（言葉ではなく、品を差し出した）';
  const body = [0,1,2].slice(0, n).map(i => CARDS[argueF][i][cards[i]][grp || 0]).join('。');
  return (pre ? pre + '。' : '') + body + '。';
}
/* いまの盤面で、この相手に向けて組み上がる論証 */
const argumentFor = (st, action) => composeArgument(action.argueF, action.cards, action.approach,
  preambleOf(st, action.charId, action.place ?? null), listenerGroup(action.charId));

/* 提示された論証が何枚刺さるか。警戒による格下げまで含めた実効の点数。 */
/* 働きかけごとに、そもそも何を当てるのかが違う。
   論じる=3枚 / 酌み交わす=利益と文脈の2枚 / 金品=当てるものなし / 肚を割る=利益の1枚。
   そのうえで、響く働きかけなら一段良く、外した働きかけなら一段悪くなる。 */
/* 判定の内訳。表示と判定が食い違わないよう、下げ幅の理由まで含めてここだけで出す。 */
function scoreBreakdown(st, action){
  const ch = CHAR_BY_ID.get(action.charId);
  const ap = action.approach ?? 0, spec = APPROACHES[ap];
  let raw;
  if (ap === 0)      raw = [0,1,2].filter(i => action.cards[i] === ch.correct[i]).length;
  else if (ap === 1) raw = [0,1].filter(i => action.cards[i] === ch.correct[i]).length;
  else if (ap === 2) raw = ch.correct[0] === 3 ? 0 : 2;   // 大義に生きる者に物を贈るのは侮辱
  else               raw = action.cards[0] === ch.correct[0] ? 3 : 0;
  /* 読み違えの罰は「相手を読んだ前提」の働きかけだけに課す。
     論じる・酌み交わすは誰にでも一応通じる（最適ではないだけ）。
     金品と肚を割るは相手を読み切った上での賭けなので、外せば裏目に出る。 */
  const misfit = ap >= 2 && approachOf(action.charId) !== ap;
  if (misfit) raw -= 1;
  const vouchedBy = vouchOf(st, action.charId), grudgedBy = grudgeOf(st, action.charId);
  const waryBy = waryOf(st.currents, action.charId, st.chaos);
  /* 人脈の誰かが顔になっていれば、旗色の警戒も決裂の悪評も通らない。
     旗色は勝つほど鮮明になり、終盤ほど警戒される。人脈はそこを通るための手形になる。 */
  const waryApplied = waryBy >= 0 && vouchedBy < 0 && raw >= 2;   // 警戒は決裂までは落とさない
  if (waryApplied) raw -= 1;
  const grudgeApplied = grudgedBy >= 0 && vouchedBy < 0 && raw >= 2;
  if (grudgeApplied) raw -= 1;
  /* 一度決裂した相手が向こうから来た場合。判定は普通どおりで、通れば和解する。
     以前は「一段重い」「通れば倍」を重ねていたが、規則を2つ減らしても難易度は
     ほとんど動かず（普通 19%→22%）、和解の成立回数はむしろ増えた。 */
  const revisit = (st.banned || []).includes(action.charId);
  return { score: clamp(raw, 0, spec.cap), misfit, vouchedBy, grudgedBy, waryBy,
           waryApplied, grudgeApplied, revisit };
}
const scoreOf = (st, action) => scoreBreakdown(st, action).score;

   紹介枠に限った話ではない。縁のある者はどの枠に出ても、あなたを門前払いしない。 */

  for (const c of st.contacts) if (TIE_GRAPH.get(c)?.has(charId)) return c;
  return -1;
}

  return -1;

function reactionOf(st, action, outcome){
  const ch = CHAR_BY_ID.get(action.charId);
  const approach = action.approach ?? 0;
  const scoreLevel = clamp(outcome.score ?? 0, 0, 3);
  let level = scoreLevel;
  const tone = TONE_OF_VOICE[voiceOf(action.charId)];
  let label = ['拒絶した','一言だけ残った',
    action.stance === 'convert' ? '認めたが動かない' : '警戒がほどけた','心を決めた'][scoreLevel];
  let cue = REACTION_CUES[approach][scoreLevel].replace('{name}', ch.name);
  const hitCat = (outcome.hits || []).findIndex(Boolean);
  if (scoreLevel === 1 && hitCat >= 0){
    const motive = CATS[hitCat].motives[ch.correct[hitCat]];
    cue = `${ch.name}は〔${motive}〕のくだりにだけ、わずかに目を留めた。`;
  }
  let line = REACTION_LINES[approach][scoreLevel][tone];
  if (action.stance === 'convert' && scoreLevel === 2) line = REACTION_CONVERT_SCORE2[tone];
  const custom = REACTION_OVERRIDES.get(action.charId)?.[scoreLevel];
  if (custom) line = custom;
  if (outcome.reconciled){
    label = '遺恨がほどけた';
    cue = `${ch.name}はしばらくこちらを見たあと、構えを解いた。`;
    line = REACTION_RECONCILED[tone];
  }
  if (outcome.duel){
    level = outcome.duel.survived ? 2 : 0;
    label = outcome.duel.survived ? '刃のあとに認めた' : '刃とともに拒んだ';
    cue = outcome.duel.survived
      ? `${ch.name}は刀を納め、こちらを初めて対等な相手として見た。`
      : `${ch.name}は刀を払うと、倒れたこちらに背を向けた。`;
    line = REACTION_DUEL[outcome.duel.survived ? 'won' : 'lost'][tone];
  }
  return { level, score:scoreLevel, label, cue, line };
}

/* --- 交渉の解決 ---------------------------------------------------------- */
/* action = { charId, stance, ownF, argueF, cards:[m0,m1,m2], probed:bool, asked:?number }
   asked は通常の問いで不正解を一つ除外したカテゴリ。判定値には影響しない。
   probed は交渉前に奥の手を使ったかどうか。使えば3つの正解すべてが分かるが、
   手の内を明かした分だけ影響力が落ち、その交渉の獲得が1下がる（最低1）。
   判定そのもの（大成功／成功／失敗／決裂）は変わらない。 */
function resolve(st, action){
  const ch = CHAR_BY_ID.get(action.charId);
  const era = eraOf(st), rank = rankOfId(action.charId);
  const premature = rank > era;                       // 時代整合性チェック
  const effRank = premature ? 0 : rank;               // 時期尚早ならボーナス無効（初級相当）

  const approach = action.approach ?? 0;
  const apSpec = APPROACHES[approach];
  const fits = approachOf(action.charId) === approach;
  const nCards = apSpec.cards;
  const hits = [0,1,2].map(i => i < nCards && action.cards[i] === ch.correct[i]);
  const rawScore = hits.filter(Boolean).length;
  const text  = argumentFor(st, action);
  const len   = chars(text);

  /* 警戒: こちらの旗色が鮮明すぎると、判定が一段下がる（決裂までは落とさない）。
     ただし人脈の誰かが顔になっていれば通らない。内訳は scoreBreakdown が持つ。 */
  const sb = scoreBreakdown(st, action);
  const waryBy = sb.waryBy;
  const score  = sb.score;

  /* 探れるのは残り回数がある場合のみ。リプレイでも同じ判定になるよう状態から決める。 */
  const probed = !!action.probed && st.probesUsed < PROBE_LIMIT;
  const asked = Number.isInteger(action.asked) && action.asked >= 0 && action.asked < 3
    ? action.asked : null;
  const deniedMotive = asked === null ? null : deniedMotiveOf(st, action.charId, asked);

  /* 転向は「攻撃」。3枚すべて刺さらねば通らない全か無かの賭け。 */
  const allOrNothing = action.stance === 'convert';
  /* 手応え: 1枚しか刺さらなくても、支持なら時勢が1だけ動く。
     1枠しか読めない打ち手は4割強のターンが完全な空振りになり、
     「1枠=29% / 2枠=93%」という崖ができていた。その中間を埋めるための段。
     ただし常にちょうど1で、ランク加算も響いた加算も乗らない。
     人脈にも加わらず、約束も残らない ―― 上の天井は動かさない。 */
  const partial = score === 1 && !allOrNothing;
  let gain = score === 3 ? 4 : (score === 2 && !allOrNothing) ? 2 : partial ? 1 : 0;
  if (gain > 0 && !partial){
    if (effRank === 1) gain += 1;
    else if (effRank === 2) gain += 2;
    else if (effRank === 3) gain *= 2;
  }
  /* 響く働きかけで通れば、それだけ深く刺さる（上限2の働きかけでも報われるよう獲得に乗せる） */
  /* 場に合った当たり方も同じだけ効くが、両方は重ねない。
     場は「相手には響かないが、ここでならやりようがある」という代替路である。 */
  const placeFits = action.place != null && PLACES[action.place].boost === approach;
  if (gain > 0 && !partial && (fits || placeFits)) gain += 1;

  /* 転向が通った褒美。満点でしか通らず、外せば決裂とランク罰を負うのに、
     獲得が支持と同額（相手の勢力を2削るだけ）では賭ける理由がなかった。
     方針を固定した自動対局で、転向を狙う打ち方は勝率32%と最も弱く、
     安全な「論じる支持のみ」49%・「型が合えば肚を割る」64%に負けていた。
     +2 にすると 58% になり、三つの打ち方が 49/64/58 に散って支配的な手が消える。
     ×1.5（67%）や ×2（83%）では今度は転向一辺倒になる。 */
  if (allOrNothing && gain > 0) gain += 2;

  /* 探った代償: その交渉で得られる時勢が1下がる（最低1）。
     元の獲得が大きい大物ほど、相対的な代償は軽く済む。 */
  const gainBeforeProbe = gain;
  if (gain > 0 && probed) gain = Math.max(1, gain - 1);
  const succeeded = gain > 0;
  let penalty = 0;
  /* 手応えどまりは「動かせなかった」ことに変わりないので、大物の代償は別に払う。
     ここを免除すると、伝説級への当てずっぽうが -3 から +1 に変わってしまう。 */
  if ((!succeeded || partial) && !premature){
    if (effRank === 2) penalty = 1;
    else if (effRank === 3) penalty = 3;
  }

  const cur = st.currents.slice();
  const before = cur.slice();
  if (succeeded){
    cur[action.argueF] += gain;
    if (action.stance === 'convert') cur[action.ownF] -= (score === 3 ? 2 : 1);
  }
  if (penalty) cur[action.stance === 'support' ? action.ownF : action.argueF] -= penalty;
  /* 肚を割って外せば、明かした旗色ごと恥をかく */
  if (approach === 3 && score === 0) cur[action.argueF] -= 2;
  for (let i = 0; i < 5; i++) cur[i] = clamp(cur[i], 0, CAP);

  /* 手応えどまりでは人脈にも加わらないし、和解もしない */
  const won = succeeded && !partial;
  const contacts = st.contacts.slice(), banned = st.banned.slice();
  if (won && !contacts.includes(action.charId)) contacts.push(action.charId);
  /* 和解。向こうから来た相手を説き伏せれば、出現停止は解ける */
  const reconciled = won && sb.revisit;
  if (reconciled){ const bi = banned.indexOf(action.charId); if (bi >= 0) banned.splice(bi, 1); }
  if (score === 0 && !banned.includes(action.charId)) banned.push(action.charId);

  /* 立ち合い。action.duel が無い場合（幕間より前の保存コード）は起きなかったものとして扱う。 */
  let duel = null;
  if (action.duel != null && duelPending(st, action)){
    const answer = DUEL_ANSWER[ch.correct[0]];
    const survived = action.duel === answer;
    duel = { choice: action.duel, survived,
             text: survived ? DUELS[action.duel].win : DUELS[action.duel].lose };
    if (survived){
      if (!contacts.includes(action.charId)) contacts.push(action.charId);
      const bi = banned.indexOf(action.charId); if (bi >= 0) banned.splice(bi, 1);
    } else {
      cur[action.argueF] = clamp(cur[action.argueF] - 3, 0, CAP);
      if (!banned.includes(action.charId)) banned.push(action.charId);
      const ci = contacts.indexOf(action.charId); if (ci >= 0) contacts.splice(ci, 1);
    }
  }

  /* 約束: 肚を割って通った相手には、そのとき掲げた旗の約束が残る。
     腹を割って本心を明かした相手にだけ残るので、論じるだけで通した相手には残らない。
     終局でその旗が採られていなければ、約束を違えたことになる。 */
  const promises = (st.promises || []).slice();
  const promised = approach === 3 && won && !banned.includes(action.charId)
                   && !promises.some(pm => pm.id === action.charId);
  if (promised) promises.push({ id: action.charId, f: action.argueF });

  const reaction = reactionOf(st, action, { score, hits, duel, reconciled });

  /* 世が荒れた分。仕掛けた時点で焚かれるので、論破は勝っても荒らす。 */
  const chaosAdded = [];
  const stoke = (key, on) => { if (!on) return;
    const c = CHAOS_CAUSES.find(x => x.key === key); chaosAdded.push(c); };
  stoke('convert', action.stance === 'convert');
  stoke('hot', action.place != null && PLACES[action.place].hot);
  stoke('misfit', sb.misfit);
  stoke('banned', banned.length > st.banned.length);
  stoke('duelLost', !!(duel && !duel.survived));
  const chaosGain = chaosAdded.reduce((a, c) => a + c.d, 0);
  const chaos = (st.chaos ?? 0) + chaosGain;

  const next = {
    seed: st.seed, origin: st.origin ?? 0, chaos, turn: st.turn + 1, currents: cur, contacts, banned, promises,
    lastLen: len,
    /* 来訪に応じた手は移動していないので、直前の場は変わらない（連泊の抜け道を作らない） */
    lastPlace: action.place != null ? action.place : (st.lastPlace ?? null),
    /* 立ち合いに敗れると、深追いする余裕を失う（一度きりの奥の手を失う） */
    probesUsed: Math.min(PROBE_LIMIT, st.probesUsed + (probed ? 1 : 0)
      + (approach === 2 ? 1 : 0) + (duel && !duel.survived ? 1 : 0)),
    interlude: st.interlude, interludes: st.interludes || [],
    actions: st.actions.concat([action]), finished: false,
  };
  next.finished = next.turn > MAX_TURN || cur.some(v => v >= CAP);
  const standingBefore = playerStanding(st);
  const standingAfter = playerStanding(next);

  return { next, report: {
    charId: action.charId, name: ch.name, score, rawScore, hits, premature, rank, effRank,
    chaos, chaosGain, chaosAdded, waryLine: waryLineOf(chaos), waryLineBefore: waryLineOf(st.chaos),
    gain, gainBeforeProbe, penalty, text, len, probed, asked, deniedMotive, duel, reaction, approach, fits, nCards,
    place: action.place ?? null, placeFits,
    probesLeft: PROBE_LIMIT - (st.probesUsed + (probed ? 1 : 0)),
    stance: action.stance, ownF: action.ownF, argueF: action.argueF, waryBy, allOrNothing,
    vouchedBy: sb.vouchedBy, grudgedBy: sb.grudgedBy,
    waryApplied: sb.waryApplied, grudgeApplied: sb.grudgeApplied,
    revisit: sb.revisit, reconciled, misfit: sb.misfit,
    delta: cur.map((v, i) => v - before[i]),
    partial,
    verdict: partial ? '手応え' : succeeded ? (score === 3 ? '大成功' : '成功')
                                            : ['決裂','失敗','失敗','失敗'][score],
    /* 立ち合いで覆ることがあるので、表示は実際の状態変化から決める */
    promised, promisedF: promised ? action.argueF : -1,
    contactAdded: contacts.includes(action.charId) && !st.contacts.includes(action.charId),
    bannedNow: banned.includes(action.charId) && !st.banned.includes(action.charId),
    standingBefore, standingAfter,
  }};
}

/* --- 幕間 ---------------------------------------------------------------- */
/* 上位2勢力の組合せ。単独で突出していても2番目まで見て事件を決める。 */
function topPairKey(currents){
  const o = [0,1,2,3,4].sort((a,b) => currents[b] - currents[a] || a - b);
  return [o[0], o[1]].sort((x,y) => x - y).join('+');
}
/* 第5ターンと第8ターンの開始時に一度ずつ。未消化ならその回の幕間データを返す */
function pendingInterlude(st){
  if (st.finished) return null;
  const n = INTERLUDE_TURNS.indexOf(st.turn);
  if (n < 0) return null;
  const done = st.interludes || [];
  if (done.some(x => x.n === n)) return null;
  const key = topPairKey(st.currents);
  return Object.assign({ key, n, turn: st.turn, last: n === INTERLUDE_TURNS.length - 1,
                         figureId: INTERLUDE_FIGURES[key][n],
                         prev: done.length ? done[done.length - 1] : null }, INTERLUDE_SETS[n][key]);
}
function applyInterlude(st, choice){
  const iv = pendingInterlude(st);
  if (!iv) return st;
  if (!Number.isInteger(choice) || !iv.opts[choice]) throw new Error('幕間の選択番号が不正です');
  const o = iv.opts[choice];
  const cur = st.currents.map((v, i) => clamp(v + o.d[i], 0, CAP));
  const rec = { n: iv.n, key: iv.key, choice, tag: o.tag, title: iv.title, after: o.after };
  return Object.assign({}, st, {
    currents: cur,
    interludes: (st.interludes || []).concat([rec]),
    interlude: rec,                       /* 直近のもの。盤面の一言などが参照する */
    /* 幕間の増減で上限に達したら、その時点で終局とする（交渉と同じ扱い） */
    finished: st.finished || cur.some(v => v >= CAP),
  });
}

/* --- 来訪 -----------------------------------------------------------------
   人脈は平均9.5人まで増えるが、そのうち5.4人（57%）は一度も何もしない。
   紹介枠と縁の判定に使われるだけで、集めた名前の半分以上が眠っていた。

   そこで、人脈の誰かが向こうから訪ねてくる手を足す。連れてくるのは、その人脈と
   史実の縁で繋がる未獲得の人物。応じると移動しないので、
   ・旅疲れがない（都市を跨いでも候補が減らない）
   ・場の縛りがない（四つの働きかけがすべて使える）
   ・連れてきた人脈が顔になるので、旗色の警戒も悪評も通らない
   代わりに、場の◎（獲得+1）は乗らず、三人から選ぶこともできない。
   盤面には何も足していない（seed・ターン・人脈から導く派生）。
   ------------------------------------------------------------------------ */
const VISIT_TURN = 3;              /* 人脈が育つまでは起きない */
const VISIT_RATE = 0.40;
const VISIT_SAYS = [
  '客を連れてきた。おぬしなら、話が通ると思うてな。',
  '客人をお連れ申した。貴殿なら話が通ると存じましてな。',
  'お客さんをお連れしましたよ。あなたなら話が通ると思いまして。',
  'お客様をお連れしました。あなたなら、お話が通ると思いまして。',
];
function visitOf(st){
  const contacts = st.contacts || [];
  if (st.turn < VISIT_TURN || contacts.length < 2 || st.finished) return null;
  const rnd = streamOf(st.seed, st.turn, 5150);
  if (rnd() >= VISIT_RATE) return null;
  const excl = new Set([...contacts, ...(st.banned || [])]);
  /* 決裂させた相手の縁筋は、こちらを訪ねてこない */
  for (const b of st.banned || []) for (const t of (TIE_GRAPH.get(b) || [])) excl.add(t);
  const maxId = MAX_ID_BY_ERA[eraOf(st)];
  const pairs = [];
  for (const h of contacts)
    for (const g of (TIE_GRAPH.get(h) || []))
      if (!excl.has(g) && g <= maxId) pairs.push([h, g]);
  if (!pairs.length) return null;
  pairs.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const [host, guest] = pairs[Math.floor(rnd() * pairs.length)];
  return { host, guest, say: VISIT_SAYS[TONE_OF_VOICE[voiceOf(host)]] };
}

/* --- エンディング判定 ---------------------------------------------------- */
/* いま最短で届く複合ルートと、先頭勢力の単独ルート。
   UIだけでなく検査からも同じ計算を使い、目標の説明と判定を食い違わせない。 */
function routeForecast(currents){
  const order = [0,1,2,3,4].sort((a,b) => currents[b] - currents[a] || a - b);
  const [a, b] = order;
  const pair = [a,b].sort((x,y) => x - y);
  const key = pair.join('+');
  const floorA = Math.max(currents[a], COMBO_MIN);
  const floorB = Math.max(currents[b], COMBO_MIN);
  const comboNeed = Math.max(0, COMBO_MIN - currents[a])
    + Math.max(0, COMBO_MIN - currents[b])
    + Math.max(0, COMBO_GOAL - floorA - floorB);
  return {
    combo:{ pair, total:currents[a] + currents[b], need:comboNeed, goal:COMBO_GOAL,
            min:COMBO_MIN, title:(ENDINGS.combo[key] || ENDINGS.combo.etc).t },
    solo:{ faction:a, total:currents[a], need:Math.max(0, GOAL - currents[a]),
           goal:GOAL, title:ENDINGS.solo[a].t },
  };
}
function evaluateEnding(st){
  const cur = st.currents, max = Math.max(...cur);
  if (max >= GOAL){
    const f = cur.indexOf(max);
    return Object.assign({ kind:'solo', faction:f }, ENDINGS.solo[f]);
  }
  const order = [0,1,2,3,4].sort((a,b) => cur[b] - cur[a] || a - b);
  const [a, b] = order;
  /* 「複合革命」を名乗るには、二番目の勢力も実体を伴っている必要がある。
     29+1 のような偏った内訳は連立ではなく、単に一勢力が届かなかっただけとみなす。 */
  if (cur[a] + cur[b] >= COMBO_GOAL && cur[b] >= COMBO_MIN){
    const key = [a,b].sort((x,y) => x - y).join('+');
    return Object.assign({ kind:'combo', pair:[a,b] }, ENDINGS.combo[key] || ENDINGS.combo['etc']);
  }
  return Object.assign({ kind:'chaos' }, ENDINGS.chaos);
}

function replay(seed, actions, interludeChoices, origin){
  let st = createState(seed, origin);
  const picks = Array.isArray(interludeChoices) ? interludeChoices
              : interludeChoices == null ? [] : [null, interludeChoices];
  const reports = [];
  for (const a of actions){
    if (st.finished) break;
    /* 幕間は、そのターンの交渉より前に解決する */
    const iv = pendingInterlude(st);
    if (iv && picks[iv.n] != null) st = applyInterlude(st, picks[iv.n]);
    if (st.finished) break;
    const r = resolve(st, a);
    st = r.next; reports.push(r.report);
  }
  return { state: st, reports };
}
function encodeSave(st){
  return 'IR9:' + st.seed + ':' + (st.origin ?? 0) + ':' + st.actions
    .map(a => [a.charId, a.stance === 'support' ? 0 : 1, a.ownF, a.argueF, a.cards.join(''),
               a.probed ? 1 : 0, a.approach ?? 0, a.place ?? ''].join(',')
              + (a.duel != null ? ',' + a.duel : ''))
    .join(';') + (st.interludes && st.interludes.length
      ? '#' + INTERLUDE_TURNS.map((t, n) => {
          const r = (st.interludes || []).find(x => x.n === n);
          return r ? r.choice : '-';
        }).join('.').replace(/(\.-)+$/, '')
      : '');
}
function decodeSave(code){
  const s = String(code).trim();
  /* IR9 で混沌が入った。荒っぽく進めるほど警戒線が下がるので、
     同じ seed と同じ手順でも判定が変わる。旧版は黙って読まずに断る。 */
  if (!/^IR9:/.test(s)) throw new Error(/^IR[1-8]:/.test(s)
    ? '旧版の保存コードです。混沌が入ったため、同じ手順でも判定が変わります'
    : 'コードの形式が違います');
  const parts = s.slice(4).split(':');
  if (!/^\d+$/.test(parts[0])) throw new Error('seed が数値ではありません');
  const seed = parseInt(parts[0], 10) >>> 0;
  if (!/^[0-2]$/.test(parts[1] ?? '')) throw new Error('出自の番号が不正です');
  const origin = +parts[1];
  const raw = parts.slice(2).join(':');
  const hash = raw.indexOf('#');
  const choiceText = hash >= 0 ? raw.slice(hash + 1) : '';
  if (hash >= 0 && !/^[0-2-](\.[0-2-])*$/.test(choiceText)) throw new Error('幕間の選択番号が不正です');
  /* '#a.b' が二度の幕間。'#a'（点なし）は幕間が一度だけだった頃のコードで、
     その一度は第8ターンのものだったので、後半の枠に入れる。 */
  const interludeChoice = hash < 0 ? null
    : choiceText.includes('.')
      ? choiceText.split('.').map(x => x === '-' || x === '' ? null : +x)
      : [null, +choiceText];
  const body = hash >= 0 ? raw.slice(0, hash) : raw;
  const actions = !body ? [] : body.split(';').filter(Boolean).map(chunk => {
    const [c, s2, o, f, k, h, apr, plc, dl] = chunk.split(',');
    if (apr !== undefined && !/^[0-3]$/.test(apr)) throw new Error('働きかけの番号が不正です');
    if (plc !== undefined && plc !== '' && !/^[0-5]$/.test(plc)) throw new Error('場の番号が不正です');
    if (dl !== undefined && !/^[0-2]$/.test(dl)) throw new Error('立ち合いの応じ方が不正です');
    return { charId:+c, stance: +s2 === 0 ? 'support' : 'convert',
             ownF:+o, argueF:+f, cards: Array.from(k).map(Number), probed: +(h || 0) === 1,
             approach: apr === undefined ? 0 : +apr,
             place: plc === undefined || plc === '' ? null : +plc,
             duel: dl === undefined ? null : +dl };
  });
  return { seed, origin, actions, interludeChoice };
}
function hashState(st){
  const s = JSON.stringify([st.seed, st.origin ?? 0, st.chaos ?? 0, st.turn, st.currents, st.contacts, st.banned,
                            st.promises, st.lastLen, st.probesUsed, st.interludes, st.lastPlace, st.finished]);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

     誰が扉を持っていて誰が持っていないかが読める。来訪も紹介も、この数から起きる。 */
  const openings = id => [...(E.TIE_GRAPH.get(id) || [])]
    .filter(t => !st.contacts.includes(t) && !st.banned.includes(t)).length;
  const list = st.contacts.length
    ? st.contacts.map(id => { const n = openings(id);
        return `<span class="pill ${n ? 'live' : 'spent'}">${esc(E.CHAR_BY_ID.get(id).name)}${
          n ? `<b>+${n}</b>` : ''}</span>`; }).join('')
      + `<div class="small" style="margin-top:4px;opacity:.75">＋の数は、その人から繋がる未獲得の人物。
         <b>この人たちが紹介を連れてくるし、向こうから訪ねてもきます。</b>数字のない人からは、もう新しい縁は出ません。</div>`
    : '<span class="small">なし</span>';
  const foesHTML = foes.length
    ? `<div class="small" style="margin-top:8px;color:var(--shu)">${foes.join('<br>')}</div>` : '';
  const ledgerHTML = `<div class="chart-ledger"><div><span class="small">【獲得した人脈】</span> ${list}</div>
    ${st.promises.length ? `<div style="margin-top:6px"><span class="small">【残した約束】</span> ${
      st.promises.map(pm => `<span class="pill vow">${esc(E.CHAR_BY_ID.get(pm.id).name)}へ〔<span class="${
        fac(pm.f).cls}">${fac(pm.f).name}</span>〕</span>`).join('')}</div>` : ''}
    ${st.banned.length ? `<div style="margin-top:6px"><span class="small">【決裂・出現停止】</span> ${
      st.banned.map(id=>`<span class="pill">${esc(E.CHAR_BY_ID.get(id).name)}</span>`).join('')}</div>` : ''}</div>`;
  const detailHTML = `<pre class="chart">${s.trimEnd()}</pre>${chaosHTML}${foesHTML}${ledgerHTML}`;
  const glanceHTML = `<div class="chart-glance" aria-label="現在の時勢">
    <span class="heat">🔥 合計 ${pad(t)}・${era}</span><span class="score chaos-chip ${
      st.chaos >= E.CHAOS_STEP * 3 ? 'high' : ''}">混沌 ${st.chaos}／警戒線 ${E.waryLineOf(st.chaos)}</span>${E.FACTIONS.map((f,i) =>
      `<span class="score ${f.cls}">${f.name} ${st.currents[i]}</span>`).join('')}</div>`;
  return `<div class="panel chart-panel ${compact ? 'compact' : ''}"><h2>時勢チャート</h2>
    ${compact ? glanceHTML : `<pre class="chart">${s.trimEnd()}</pre>`}
    <div class="route-guide" aria-label="エンディングへの進み具合">
      <div class="route-card combo ${comboReached ? 'reached' : ''}" style="--route-a:${FACTION_RGB[pair[0]]};--route-b:${FACTION_RGB[pair[1]]}">
        <span class="need">${comboReached ? '到達圏' : `あと${route.combo.need}`}</span>
        <div class="kind">通常ルート｜二つを育てる</div>
        <div class="name">『${esc(route.combo.title)}』</div>
        <span class="${fac(pair[0]).cls}">${fac(pair[0]).name} ${st.currents[pair[0]]}</span> ＋
        <span class="${fac(pair[1]).cls}">${fac(pair[1]).name} ${st.currents[pair[1]]}</span>
        <span class="rule">合計 ${route.combo.total} / ${E.COMBO_GOAL}、両方10以上</span>
      </div>
      <div class="route-card ${soloReached ? 'reached' : ''}">
        <span class="need">${soloReached ? '到達圏' : `あと${route.solo.need}`}</span>
        <div class="kind">高難度ルート｜一つに寄せ切る</div>
        <div class="name">『${esc(route.solo.title)}』</div>
        <span class="${fac(route.solo.faction).cls}">${fac(route.solo.faction).name} ${route.solo.total}</span>
        <span class="rule">単独 ${route.solo.total} / ${E.GOAL}（30到達時はこちらが優先）</span>
      </div>
    </div>
    ${compact
      ? `<details class="detail chart-more"><summary>棒グラフ・混沌・人脈・約束を見る</summary>${detailHTML}</details>`
      : `${chaosHTML}${foesHTML}${ledgerHTML}`}
  </div>`;
}
